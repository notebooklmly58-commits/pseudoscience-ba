/* ═══════════════════════════════════════════════════════════
   FEATURE: STATS (localStorage: qbank_stats_v1)
   ═══════════════════════════════════════════════════════════ */
const STATS_KEY = 'qbank_stats_v1';
function emptyStats(){
  return { v:1, savedAt:0, totalAnswered:0, totalCorrect:0, dailyCounts:{}, perCategory:{}, perSet:{}, streak:{ current:0, longest:0, lastDate:null } };
}
function sanitizePair(o){ return { a: Math.max(0, Math.floor(num(o && o.a))), c: Math.max(0, Math.floor(num(o && o.c))) }; }
function sanitizeStats(s){
  const o = emptyStats();
  if(!s || typeof s !== 'object') return o;
  o.savedAt = num(s.savedAt);
  o.totalAnswered = Math.max(0, Math.floor(num(s.totalAnswered)));
  o.totalCorrect = Math.max(0, Math.floor(num(s.totalCorrect)));
  ['dailyCounts','perCategory','perSet'].forEach(f => {
    const src = s[f];
    if(src && typeof src === 'object'){
      Object.keys(src).slice(0, 3000).forEach(k => {
        if(!safeKey(k)) return;
        if(f === 'dailyCounts' && !/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
        o[f][k] = sanitizePair(src[k]);
      });
    }
  });
  const st = s.streak || {};
  o.streak.current = Math.max(0, Math.floor(num(st.current)));
  o.streak.longest = Math.max(0, Math.floor(num(st.longest)));
  o.streak.lastDate = (typeof st.lastDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(st.lastDate)) ? st.lastDate : null;
  return o;
}
function pruneDaily(s, keep){
  const keys = Object.keys(s.dailyCounts).sort();
  while(keys.length > keep){ delete s.dailyCounts[keys.shift()]; }
}
function saveStats(){
  const s = state.stats;
  s.savedAt = Date.now();
  pruneDaily(s, 180);
  lsSet(STATS_KEY, s);
  scheduleCloudSync('stats');
}
function recordAnswer(categoryId, setId, isCorrect){
  const s = state.stats;
  s.totalAnswered++; if(isCorrect) s.totalCorrect++;
  const k = dayKey();
  const d = s.dailyCounts[k] || (s.dailyCounts[k] = { a:0, c:0 });
  d.a++; if(isCorrect) d.c++;
  if(categoryId != null && safeKey(String(categoryId))){
    const c = s.perCategory[categoryId] || (s.perCategory[categoryId] = { a:0, c:0 });
    c.a++; if(isCorrect) c.c++;
  }
  if(setId != null && safeKey(String(setId))){
    const c = s.perSet[setId] || (s.perSet[setId] = { a:0, c:0 });
    c.a++; if(isCorrect) c.c++;
  }
  saveStats();
}
function recordSessionEnd(){
  const s = state.stats, st = s.streak, today = dayKey();
  if(st.lastDate === today) return;
  if(st.lastDate && daysBetween(st.lastDate, today) === 1) st.current++;
  else st.current = 1;
  st.longest = Math.max(st.longest, st.current);
  st.lastDate = today;
  saveStats();
}
function currentStreakShown(){
  const st = state.stats.streak;
  if(!st.lastDate) return 0;
  return daysBetween(st.lastDate, dayKey()) > 1 ? 0 : st.current;
}

/* ═══════════════════════════════════════════════════════════
   FEATURE: WRONG BANK (localStorage: qbank_wrong_bank_v1)
   ═══════════════════════════════════════════════════════════ */
const WRONG_KEY = 'qbank_wrong_bank_v1';
const WRONG_MAX = 500;
function sanitizeWrongBank(w){
  const o = { v:1, savedAt:0, items:{} };
  if(!w || typeof w !== 'object') return o;
  o.savedAt = num(w.savedAt);
  const src = w.items;
  if(src && typeof src === 'object'){
    Object.keys(src).slice(0, WRONG_MAX).forEach(id => {
      if(!safeKey(id)) return;
      const it = src[id] || {};
      o.items[id] = {
        addedAt: num(it.addedAt), wrongCount: Math.max(1, Math.floor(num(it.wrongCount, 1))), lastWrongAt: num(it.lastWrongAt),
        categoryId: (it.categoryId != null && safeKey(String(it.categoryId))) ? String(it.categoryId) : null,
        setId: (it.setId != null && safeKey(String(it.setId))) ? String(it.setId) : null,
        preview: String(it.preview || '').slice(0, 80),
      };
    });
  }
  return o;
}
function saveWrongBank(){
  const wb = state.wrongBank;
  const ids = Object.keys(wb.items);
  if(ids.length > WRONG_MAX){
    ids.sort((a,b) => wb.items[a].lastWrongAt - wb.items[b].lastWrongAt);
    ids.slice(0, ids.length - WRONG_MAX).forEach(id => { delete wb.items[id]; });
  }
  wb.savedAt = Date.now();
  lsSet(WRONG_KEY, wb);
  scheduleCloudSync('wrong');
}
function wrongBankCount(){ return Object.keys(state.wrongBank.items).length; }
function updateWrongBank(q){
  if(!q || !q.questions) return;
  ensureQuizFields(q);
  const wb = state.wrongBank;
  let dirty = false;
  q.questions.forEach((question, i) => {
    const ua = (q.userAnswers || [])[i];
    if(ua === null || ua === undefined || !question || question.id == null) return;
    const id = String(question.id);
    if(q.banked[id] || !safeKey(id)) return;
    q.banked[id] = 1;
    if(ua === question.correct){
      const it = wb.items[id];
      if(it){ it.wrongCount--; if(it.wrongCount <= 0) delete wb.items[id]; dirty = true; }
    } else {
      const it = wb.items[id];
      const now = Date.now();
      if(it){ it.wrongCount++; it.lastWrongAt = now; }
      else wb.items[id] = {
        addedAt: now, wrongCount: 1, lastWrongAt: now,
        categoryId: question.categoryId != null ? String(question.categoryId) : null,
        setId: question.setId != null ? String(question.setId) : null,
        preview: String(question.question || '').slice(0, 80),
      };
      dirty = true;
    }
  });
  if(dirty) saveWrongBank();
}
window.removeWrongItem = (id) => {
  delete state.wrongBank.items[id];
  saveWrongBank(); render();
};
window.clearWrongBank = () => {
  askConfirm({ title:'مسح بنك الأخطاء', body:'سيتم حذف كل الأسئلة المحفوظة في بنك الأخطاء (' + wrongBankCount() + ' سؤال). متابعة؟', okLabel:'مسح الكل' }, () => {
    state.wrongBank.items = {};
    saveWrongBank(); render();
    showToast('تم مسح بنك الأخطاء', 'ok');
  });
};

/* ═══════════════════════════════════════════════════════════
   FEATURE: BOOKMARKS (localStorage: qbank_bookmarks_v1)
   ═══════════════════════════════════════════════════════════ */
const BM_KEY = 'qbank_bookmarks_v1';
const BM_MAX = 300;
const qCache = {};
function sanitizeBookmarks(b){
  const o = { v:1, savedAt:0, ids:[], meta:{} };
  if(!b || typeof b !== 'object') return o;
  o.savedAt = num(b.savedAt);
  (Array.isArray(b.ids) ? b.ids : []).slice(0, BM_MAX).forEach(id => {
    id = String(id);
    if(!safeKey(id) || o.ids.includes(id)) return;
    o.ids.push(id);
    const m = (b.meta && b.meta[id]) || {};
    o.meta[id] = { cat: (m.cat != null && safeKey(String(m.cat))) ? String(m.cat) : null, preview: String(m.preview || '').slice(0, 80) };
  });
  return o;
}
function saveBookmarks(){
  state.bookmarks.savedAt = Date.now();
  lsSet(BM_KEY, state.bookmarks);
  scheduleCloudSync('bookmarks');
}
function isBookmarked(id){ return id != null && state.bookmarks.ids.includes(String(id)); }
function toggleBookmarkQuestion(question){
  if(!question || question.id == null) return;
  const id = String(question.id);
  const bm = state.bookmarks;
  const i = bm.ids.indexOf(id);
  if(i >= 0){
    bm.ids.splice(i, 1); delete bm.meta[id];
    showToast('أُزيل من المحفوظات', 'info', 1400);
  } else {
    if(bm.ids.length >= BM_MAX){ const old = bm.ids.shift(); delete bm.meta[old]; }
    bm.ids.push(id);
    bm.meta[id] = { cat: question.categoryId != null ? String(question.categoryId) : null, preview: String(question.question || '').slice(0, 80) };
    qCache[id] = question;
    showToast('تم الحفظ في المحفوظات', 'ok', 1400);
  }
  twaHaptic('light');
  saveBookmarks();
  render();
}

window.toggleBookmarkStudy = (i) => { const s = state.study; if(s) toggleBookmarkQuestion(s.questions[i]); };
window.removeBookmark = (id) => {
  const bm = state.bookmarks, i = bm.ids.indexOf(String(id));

};

/* ═══════════════════════════════════════════════════════════
   FEATURE: QUIZ TRACKING + TIMER
   ═══════════════════════════════════════════════════════════ */
function initQuizTracking(q){
  const n = q.questions.length, now = Date.now();
  q.timerEnabled = false; q.timerEndsAt = null; q.timerRemaining = null; q.timerDurationMs = 0;
  q.startedAt = now; q.questionStartedAt = now;
  q.timePerQuestion = new Array(n).fill(0);
  q.banked = {};
  if(!q.userAnswers) q.userAnswers = new Array(n).fill(null);
  return q;
}
function ensureQuizFields(q){
  if(!q) return q;
  const n = q.questions.length;
  if(!Array.isArray(q.timePerQuestion) || q.timePerQuestion.length !== n) q.timePerQuestion = new Array(n).fill(0);
  if(!q.banked || typeof q.banked !== 'object') q.banked = {};
  if(!q.startedAt) q.startedAt = Date.now();
  if(!q.questionStartedAt) q.questionStartedAt = Date.now();
  if(q.timerEnabled === undefined) q.timerEnabled = false;
  return q;
}
function clearTimers(){
  (state.timers || []).forEach(id => clearInterval(id));
  state.timers = [];
}
function timerTick(){
  const q = state.quiz;
  if(!q || state.view !== 'quiz' || !q.timerEnabled) return;
  const rem = Math.max(0, Math.ceil((q.timerEndsAt - Date.now()) / 1000));
  q.timerRemaining = rem;
  const el = document.getElementById('quizTimer');
  if(el){
    const t = el.querySelector('.tv'); if(t) t.textContent = fmtTime(rem);
    el.classList.toggle('low', rem <= 300);
  }
  if(rem <= 0){
    clearTimers();
    showToast('انتهى وقت الاختبار', 'info', 3000);
    finishQuiz(true);
  }
}
function startTimerTick(){
  clearTimers();
  const q = state.quiz;
  if(!q || !q.timerEnabled || state.view !== 'quiz') return;
  timerTick();
  if(state.view !== 'quiz' || !state.quiz || !state.quiz.timerEnabled) return;
  state.timers.push(setInterval(timerTick, 1000));
}
document.addEventListener('visibilitychange', () => {
  if(!document.hidden){ timerTick(); }
  else if(cloudDirty.size){ clearTimeout(cloudTimer); flushCloud(); }
});

/* ═══════════════════════════════════════════════════════════
   FEATURE: PAGED / CHUNKED QUERIES (≤500 rows, .in ≤50 items)
   ═══════════════════════════════════════════════════════════ */
const Q_COLS = 'id,category_id,set_id,question_text,options,correct_index,explanation';
async function pagedSelect(makeQuery){
  const PAGE = 500, out = [];
  for(let from = 0; from < 50000; from += PAGE){
    const { data, error } = await makeQuery(from, from + PAGE - 1);
    if(error) return { data:null, error };
    out.push(...(data || []));
    if(!data || data.length < PAGE) break;
  }
  return { data: out, error: null };
}
async function selectIn(table, cols, column, ids){
  const out = [];
  for(let i = 0; i < ids.length; i += 50){
    const chunk = ids.slice(i, i + 50);
    const { data, error } = await pagedSelect((a,b) => sb.from(table).select(cols).in(column, chunk).order('id', { ascending:true }).range(a, b));
    if(error) return { data:null, error };
    out.push(...data);
  }
  return { data: out, error: null };
}
function mapQuestionRow(row){
  return {
    id: row.id,
    categoryId: row.category_id != null ? String(row.category_id) : null,
    setId: row.set_id != null ? String(row.set_id) : null,
    question: row.question_text,
    options: row.options,
    correct: row.correct_index,
    explanation: row.explanation || null,
  };
}
/* عشوائية ثابتة بالـ seed (لتعمل المزامنة بين الأجهزة) */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const a = arr.slice(), rnd = mulberry32(seed);
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ═══════════════════════════════════════════════════════════
   FEATURE: PRACTICE FROM IDS (wrong bank / bookmarks) + RETRY WRONG
   ═══════════════════════════════════════════════════════════ */
function startPlainQuiz(questions, label, sourceType){
  const q = {
    questions, index:0, correct:0, wrongList:[], answered:false, selected:null,
    userAnswers: new Array(questions.length).fill(null),
    sourceLabel: label, sourceType: sourceType,
  };
  initQuizTracking(q);
  state.quiz = q; state.view = 'quiz'; state.notice = null;
  saveProgress(); render();
  try{ window.scrollTo({ top:0 }); }catch(e){ /* noop */ }
}
async function practiceByIds(ids, label, sourceType, onMissing){
  ids = ids.slice(0, 50);
  if(!ids.length) return;
  showToast('جارٍ تحميل الأسئلة...', 'info', 1500);
  const { data, error } = await sb.from('questions').select(Q_COLS).in('id', ids);
  if(error){ window.__debugLog('practiceByIds error: ' + error.message); showToast('تعذّر تحميل الأسئلة، حاول مرة أخرى.', 'err'); return; }
  const rows = data || [];
  if(onMissing){ const got = new Set(rows.map(r => String(r.id))); onMissing(ids.filter(id => !got.has(String(id)))); }
  if(!rows.length){ showToast('لم تعد هذه الأسئلة موجودة.', 'err'); render(); return; }
  const questions = shuffleArray(rows.map(mapQuestionRow));
  questions.forEach(qq => { qCache[String(qq.id)] = qq; });
  startPlainQuiz(questions, label, sourceType);
}
window.practiceWrongBank = () => {
  const items = state.wrongBank.items;
  const ids = Object.keys(items).sort((a,b) => (items[b].wrongCount - items[a].wrongCount) || (items[b].lastWrongAt - items[a].lastWrongAt)).slice(0, 50);
  practiceByIds(ids, 'بنك الأخطاء', 'wrong_bank', (missing) => {
    if(missing.length){ missing.forEach(id => { delete items[id]; }); saveWrongBank(); }
  });
};
window.practiceBookmarks = () => { practiceByIds(state.bookmarks.ids.slice(-50), 'الأسئلة المحفوظة', 'bookmarks'); };
window.openBookmark = (id) => {
  id = String(id);
  const cached = qCache[id];
  if(cached){ startPlainQuiz([JSON.parse(JSON.stringify(cached))], 'سؤال محفوظ', 'bookmarks'); return; }
  practiceByIds([id], 'سؤال محفوظ', 'bookmarks');
};
function retryWrongOnly(categoryId){
  const q0 = state.quiz;
  if(!q0 || !q0.wrongList.length) return;

/* ═══════════════════════════════════════════════════════════
   FEATURE: CLOUD SYNC (Telegram CloudStorage, best-effort, LWW)
   ═══════════════════════════════════════════════════════════ */
const CS = (function(){
  try{ if(TWA && TWA.CloudStorage && TWA.isVersionAtLeast && TWA.isVersionAtLeast('6.9')) return TWA.CloudStorage; }catch(e){ /* noop */ }
  return null;
})();
const CLOUD_KEYS = { progress:'qbank_progress_v1', stats:'qbank_stats_v1', bookmarks:'qbank_bookmarks_v1', theme:'qbank_theme', wrong:'qbank_wrong_bank_v1' };
const cloudDirty = new Set();
let cloudTimer = null;

function cloudGetItems(keys){
  return new Promise(resolve => {
    let done = false;
    const t = setTimeout(() => { if(!done){ done = true; resolve(null); } }, 6000);
    try{
      CS.getItems(keys, (err, vals) => { if(done) return; done = true; clearTimeout(t); resolve(err ? null : (vals || {})); });
    }catch(e){ if(!done){ done = true; clearTimeout(t); resolve(null); } }
  });
}
function cloudSetItem(key, value){
  return new Promise(resolve => {
    let done = false;
    const t = setTimeout(() => { if(!done){ done = true; resolve(false); } }, 6000);
    try{
      CS.setItem(key, value, (err, ok) => { if(done) return; done = true; clearTimeout(t); resolve(!err && ok !== false); });
    }catch(e){ if(!done){ done = true; clearTimeout(t); resolve(false); } }
  });
}
function scheduleCloudSync(kind){
  if(!CS) return;
  cloudDirty.add(kind);
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(flushCloud, 5000);
}
function encodeAnswers(arr){
  return (arr || []).map(v => (v === null || v === undefined) ? '-' : Math.min(35, Math.max(0, v)).toString(36)).join('');
}
function decodeAnswers(str, n){
  const out = new Array(n).fill(null);
  String(str || '').split('').forEach((ch, i) => { if(i < n && ch !== '-'){ const v = parseInt(ch, 36); if(!isNaN(v)) out[i] = v; } });
  return out;
}
function buildProgressPayload(){
  const p = readProgress();
  if(!p) return { v:1, savedAt: Date.now(), cleared:true };
  const q = p.quiz;
  const type = q.sourceType;
  if(type !== 'category' && type !== 'questionSet' && type !== 'examGroup') return null;
  return {
    v:1, savedAt: p.savedAt, sl: String(q.sourceLabel || '').slice(0, 60), st: type,
    sid: type === 'category' ? q.sourceNodeId : type === 'questionSet' ? (q.sourceSetId || null) : q.sourceGroupId,
    sc: type === 'questionSet' ? q.sourceCategoryId : null,
    sub: q.sourceIncludeSub ? 1 : 0, seed: q.seed || 0, n: q.questions.length, i: q.index || 0,
    a: encodeAnswers(q.userAnswers), te: q.timerEnabled ? 1 : 0, tt: q.timerEndsAt || 0, td: q.timerDurationMs || 0, s0: q.startedAt || 0,
  };
}
function fitCompact(build){
  /* يبني payload ويقلّصه تدريجيًا حتى يصبح ≤ 4000 بايت */
  for(let level = 0; level < 8; level++){
    const p = build(level);
    const str = JSON.stringify(p);
    if(byteLen(str) <= 4000) return str;
  }
  return null;
}
function buildCloudValue(kind){
  if(kind === 'progress'){
    const p = buildProgressPayload();
    if(!p) return null;
    const s = JSON.stringify(p);
    return byteLen(s) <= 4000 ? s : null;
  }
  if(kind === 'theme'){
    return getThemePref() + '|' + (localStorage.getItem(THEME_AT_KEY) || '0');
  }
  if(kind === 'stats'){
    const s = state.stats;
    return fitCompact(level => {
      const days = [90, 60, 40, 30, 21, 14, 7, 3][level];
      const keys = Object.keys(s.dailyCounts).sort().slice(-days);
      const d = {}; keys.forEach(k => { d[k.slice(2).replace(/-/g,'')] = [s.dailyCounts[k].a, s.dailyCounts[k].c]; });
      const capCats = [Infinity, Infinity, 30, 20, 12, 8, 5, 3][level];
      const cats = {}; Object.keys(s.perCategory).sort((a,b) => s.perCategory[b].a - s.perCategory[a].a).slice(0, capCats).forEach(k => { cats[k] = [s.perCategory[k].a, s.perCategory[k].c]; });
      const sets = {};
      if(level < 2) Object.keys(s.perSet).sort((a,b) => s.perSet[b].a - s.perSet[a].a).slice(0, 25).forEach(k => { sets[k] = [s.perSet[k].a, s.perSet[k].c]; });
      return { v:1, savedAt: s.savedAt, t:[s.totalAnswered, s.totalCorrect], s:[s.streak.current, s.streak.longest, s.streak.lastDate], d, c:cats, st:sets, tr:1 };
    });
  }
  if(kind === 'bookmarks'){
    const bm = state.bookmarks;
    return fitCompact(level => {
      const cap = [300, 80, 60, 45, 30, 20, 12, 6][level];
      const ids = bm.ids.slice(-cap);
      const meta = {};
      if(level < 4) ids.forEach(id => { const m = bm.meta[id] || {}; meta[id] = [m.cat, String(m.preview || '').slice(0, [80, 30, 15, 8][level])]; });
      return { v:1, savedAt: bm.savedAt, ids, m: meta, tr: ids.length < bm.ids.length ? 1 : 0 };
    });
  }
  if(kind === 'wrong'){
    const wb = state.wrongBank;
    return fitCompact(level => {
      const cap = [20, 14, 10, 7, 5, 3, 2, 1][level];
      const ids = Object.keys(wb.items).sort((a,b) => wb.items[b].lastWrongAt - wb.items[a].lastWrongAt).slice(0, cap);
      const items = ids.map(id => { const it = wb.items[id]; return [id, it.wrongCount, it.lastWrongAt, it.categoryId, it.setId, String(it.preview || '').slice(0, [40, 30, 20, 12][Math.min(level, 3)])]; });
      return { v:1, savedAt: wb.savedAt, it: items, tr:1 };
    });
  }
  return null;
}
async function flushCloud(){
  cloudTimer = null;
  if(!CS) return;
  const kinds = Array.from(cloudDirty); cloudDirty.clear();
  for(const kind of kinds){
    try{
      const val = buildCloudValue(kind);
      if(val == null){ window.__debugLog('cloud sync: تخطّي ' + kind + ' (حجم أكبر من 4KB أو غير قابل للمزامنة)'); continue; }
      await cloudSetItem(CLOUD_KEYS[kind], val);
    }catch(e){ window.__debugLog('cloud sync error (' + kind + '): ' + (e.message || e)); }
  }
}
function parseJSONSafe(s){ try{ return s ? JSON.parse(s) : null; }catch(e){ return null; } }
async function syncFromCloud(){
  if(!CS) return;
  const vals = await cloudGetItems(Object.values(CLOUD_KEYS));
  if(!vals) return;
  let changed = false;

  /* progress */
  const cp = parseJSONSafe(vals[CLOUD_KEYS.progress]);
  const lp = readProgress();
  const localAt = lp ? lp.savedAt : 0;
  if(cp && cp.savedAt > localAt){
    if(cp.cleared){
      if(lp){ try{ localStorage.removeItem(PROGRESS_KEY); }catch(e){ /* noop */ } state.resumeAvailable = null; changed = true; }
    } else if(cp.st && cp.n > 0){
      state.cloudProgress = cp;
      state.resumeAvailable = { savedAt: cp.savedAt, cloud:true, quiz:{ sourceLabel: cp.sl || '', userAnswers: decodeAnswers(cp.a, cp.n), questions:{ length: cp.n } } };
      changed = true;
    }
  }

  /* stats */
  const cs = parseJSONSafe(vals[CLOUD_KEYS.stats]);
  if(cs && num(cs.savedAt) > state.stats.savedAt){
    const loc = state.stats;
    const merged = emptyStats();
    merged.savedAt = cs.savedAt;
    merged.totalAnswered = Math.max(0, Math.floor(num(cs.t && cs.t[0])));
    merged.totalCorrect = Math.max(0, Math.floor(num(cs.t && cs.t[1])));
    const s = cs.s || [];
    merged.streak = { current: Math.max(0, Math.floor(num(s[0]))), longest: Math.max(0, Math.floor(num(s[1]))), lastDate: (typeof s[2] === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s[2])) ? s[2] : null };
    Object.keys(cs.d || {}).forEach(k => { if(/^\d{6}$/.test(k)){ const full = '20' + k.slice(0,2) + '-' + k.slice(2,4) + '-' + k.slice(4,6); merged.dailyCounts[full] = sanitizePair({ a: cs.d[k][0], c: cs.d[k][1] }); } });
    Object.keys(cs.c || {}).forEach(k => { if(safeKey(k)) merged.perCategory[k] = sanitizePair({ a: cs.c[k][0], c: cs.c[k][1] }); });
    Object.keys(cs.st || {}).forEach(k => { if(safeKey(k)) merged.perSet[k] = sanitizePair({ a: cs.st[k][0], c: cs.st[k][1] }); });
    ['dailyCounts','perCategory','perSet'].forEach(f => { Object.keys(loc[f]).forEach(k => { if(!merged[f][k]) merged[f][k] = loc[f][k]; }); });
    state.stats = merged;
    lsSet(STATS_KEY, merged);
    changed = true;
  }

  /* bookmarks */
  const cb = parseJSONSafe(vals[CLOUD_KEYS.bookmarks]);
  if(cb && num(cb.savedAt) > state.bookmarks.savedAt){
    const meta = {};
    Object.keys(cb.m || {}).forEach(id => { const m = cb.m[id] || []; meta[id] = { cat: m[0], preview: m[1] }; });
    const next = sanitizeBookmarks({ savedAt: cb.savedAt, ids: cb.ids || [], meta });
    if(cb.tr){ state.bookmarks.ids.forEach(id => { if(!next.ids.includes(id)){ next.ids.unshift(id); next.meta[id] = state.bookmarks.meta[id]; } }); }
    state.bookmarks = next;
    lsSet(BM_KEY, next);
    changed = true;
  }

  /* wrong bank */
  const cw = parseJSONSafe(vals[CLOUD_KEYS.wrong]);
  if(cw && num(cw.savedAt) > state.wrongBank.savedAt){
    const items = {};
    (cw.it || []).forEach(r => { if(Array.isArray(r)) items[String(r[0])] = { addedAt: num(r[2]), wrongCount: num(r[1], 1), lastWrongAt: num(r[2]), categoryId: r[3], setId: r[4], preview: r[5] }; });
    const next = sanitizeWrongBank({ savedAt: cw.savedAt, items });
    Object.keys(state.wrongBank.items).forEach(id => { if(!next.items[id]) next.items[id] = state.wrongBank.items[id]; });
    state.wrongBank = next;
    lsSet(WRONG_KEY, next);
    changed = true;
  }

  /* theme */
  const ct = String(vals[CLOUD_KEYS.theme] || '').split('|');
  if(ct.length === 2 && (ct[0] === 'dark' || ct[0] === 'light' || ct[0] === 'auto') && num(ct[1]) > num(localStorage.getItem(THEME_AT_KEY))){
    try{ localStorage.setItem(THEME_KEY, ct[0]); localStorage.setItem(THEME_AT_KEY, ct[1]); }catch(e){ /* noop */ }
    applyTheme();
  }

  if(changed && ['home','stats','bookmarks','wrongBank'].includes(state.view)) render();
}
/* استئناف اختبار محفوظ في السحابة (بدون مصفوفة الأسئلة) */
async function resumeFromCloud(cp){
  const resume = { seed: cp.seed, index: cp.i, userAnswers: decodeAnswers(cp.a, cp.n), n: cp.n, timerEnabled: !!cp.te, timerEndsAt: cp.tt || null, timerDurationMs: cp.td || 0, startedAt: cp.s0 || Date.now() };
  showToast('جارٍ استعادة الاختبار...', 'info', 1500);
  if(cp.st === 'category') await startQuiz(cp.sid, !!cp.sub, false, resume);
  else if(cp.st === 'questionSet') await startSetQuiz(cp.sc, cp.sid || null, false, resume);
  else if(cp.st === 'examGroup') await startCustomExam(cp.sid, false, resume);
}
/* يضبط حالة الاختبار المبني من جديد حسب resume أو يعرض مودال النمط */
function launchQuiz(q, resume){
  initQuizTracking(q);
  if(resume){
    if(resume.n && resume.n !== q.questions.length){
      showToast('تغيّرت أسئلة هذا الاختبار، سيبدأ من جديد.', 'info', 3500);
      clearProgress(); state.resumeAvailable = null; promptQuizMode(q); return;
    }
    q.userAnswers = resume.userAnswers.slice(0, q.questions.length);
    q.index = Math.min(Math.max(0, resume.index || 0), q.questions.length - 1);
    q.userAnswers.forEach((ua, i) => {
      if(ua === null || ua === undefined) return;
      if(ua === q.questions[i].correct) q.correct++; else q.wrongList.push({ question: q.questions[i], chosen: ua });
    });
    const ua = q.userAnswers[q.index];
    q.answered = !(ua === null || ua === undefined); q.selected = q.answered ? ua : null;
    q.timerEnabled = resume.timerEnabled; q.timerEndsAt = resume.timerEndsAt; q.timerDurationMs = resume.timerDurationMs;
    q.startedAt = resume.startedAt;
    state.cloudProgress = null; state.resumeAvailable = null;
    enterQuizView(q);
    return;
  }
  promptQuizMode(q);
}

/* ═══════════════════════════════════════════════════════════
   FEATURE: BACKUP (export / import)
   ═══════════════════════════════════════════════════════════ */
function buildBackupObject(){
  return { v:1, app:'pseudoscience-qbank', exportedAt: Date.now(), stats: state.stats, bookmarks: state.bookmarks, wrongBank: state.wrongBank, theme: getThemePref() };
}
window.openExportBackup = () => { state.backupModal = { mode:'export', text: JSON.stringify(buildBackupObject()) }; renderModalRoot(); };
window.openImportBackup = () => { state.backupModal = { mode:'import' }; renderModalRoot(); };
window.closeBackup = () => { state.backupModal = null; renderModalRoot(); };
window.copyBackup = async () => {
  const text = state.backupModal ? state.backupModal.text : '';
  try{ await navigator.clipboard.writeText(text); showToast('تم نسخ النسخة الاحتياطية', 'ok'); return; }catch(e){ /* fallback */ }
  const ta = document.getElementById('backupTa');
  if(ta){ ta.focus(); ta.select(); try{ document.execCommand('copy'); showToast('تم النسخ', 'ok'); }catch(e){ showToast('انسخ النص يدويًا', 'info'); } }
};
window.downloadBackup = () => {
  try{
    const blob = new Blob([state.backupModal.text], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'qbank-backup-' + dayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }catch(e){ showToast('التنزيل غير مدعوم هنا — استخدم زر النسخ', 'info', 3500); }
};
function applyBackupText(text){
  let obj;
  try{ obj = JSON.parse(text); }catch(e){ showToast('الملف ليس JSON صالحًا', 'err'); return; }
  if(!obj || obj.v !== 1 || obj.app !== 'pseudoscience-qbank'){ showToast('هذه ليست نسخة احتياطية صالحة', 'err'); return; }
  const now = Date.now();
  if(obj.stats){ state.stats = sanitizeStats(obj.stats); saveStats(); }
  if(obj.bookmarks){ state.bookmarks = sanitizeBookmarks(obj.bookmarks); saveBookmarks(); }
  if(obj.wrongBank){ state.wrongBank = sanitizeWrongBank(obj.wrongBank); saveWrongBank(); }
  if(obj.theme === 'dark' || obj.theme === 'light' || obj.theme === 'auto'){
    try{ localStorage.setItem(THEME_KEY, obj.theme); localStorage.setItem(THEME_AT_KEY, String(now)); }catch(e){ /* noop */ }
    applyTheme(); scheduleCloudSync('theme');
  }
  state.backupModal = null; renderModalRoot(); render();
  showToast('تم استيراد النسخة الاحتياطية', 'ok');
}
window.importBackupText = () => { const ta = document.getElementById('importTa'); applyBackupText(ta ? ta.value : ''); };
window.importBackupFile = (inp) => {
  const f = inp.files && inp.files[0]; if(!f) return;
  if(f.size > 2 * 1024 * 1024){ showToast('الملف كبير جدًا', 'err'); return; }
  const r = new FileReader();
  r.onload = e => applyBackupText(String(e.target.result || ''));
  r.readAsText(f, 'UTF-8');
};
window.resetStats = () => {
  askConfirm({ title:'تصفير الإحصاءات', body:'سيتم حذف كل إحصاءاتك (الإجابات، الأيام، السلسلة). هل أنت متأكد؟', okLabel:'متابعة' }, () => {
    askConfirm({ title:'تأكيد نهائي', body:'لا يمكن التراجع عن هذا الإجراء. تصفير الإحصاءات نهائيًا؟', okLabel:'نعم، صفّر' }, () => {
      state.stats = emptyStats(); saveStats(); render(); showToast('تم تصفير الإحصاءات', 'ok');
    });
  });
};

   FEATURE: VIEWS — results (pro) / stats / wrong bank / bookmarks

function pctClass(p){ return p >= 80 ? 'hi' : p >= 60 ? 'mid' : 'lo'; }
function catName(id){ const c = id != null ? byId(String(id)) : null; return c ? c.name : 'بدون قسم'; }
function emptyArt(kind, text){
  const art = {
    box: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 24l24-12 24 12-24 12L8 24z"/><path d="M8 24v20l24 12 24-12V24"/><path d="M32 36v20"/></svg>',
    star: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M32 8l7.5 15.5L56 26l-12 11.5L47 54 32 46 17 54l3-16.5L8 26l16.5-2.5z"/></svg>',
    chart: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 8v48h48"/><rect x="16" y="32" width="8" height="16"/><rect x="30" y="22" width="8" height="26"/><rect x="44" y="14" width="8" height="34"/></svg>',
    folder: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16h18l6 8h28v28H6z"/></svg>',
  }[kind] || '';
  return `<div class="emptyState emptyArt">${art}<div>${text}</div></div>`;
}
function resultsDuration(q){
  const end = q.finishedAt || Date.now();
  let ms = Math.max(0, end - (q.startedAt || end));
  if(q.timerEnabled && q.timerDurationMs) ms = Math.min(ms, q.timerDurationMs);
  return ms;
}
function renderResults(){
  const q = ensureQuizFields(state.quiz);
  const total = q.questions.length, st = quizStats(q);
  const score = total ? Math.round(st.correct / total * 100) : 0;
  const acc = st.answered ? Math.round(st.correct / st.answered * 100) : 0;
  const dur = resultsDuration(q);
  const spent = q.timePerQuestion.reduce((a,b) => a + b, 0);
  const avg = st.answered ? spent / st.answered : 0;
  const C = 2 * Math.PI * 52;
  const target = C * (1 - score / 100);
  const offset = state.resultsAnimated ? target : C;
  const tab = state.resultsTab || 'summary';
  const wrong = q.wrongList.length;

  let body = '';
  if(tab === 'summary'){
    body = `
      <div class="statGrid">
        <div class="statCard ok"><div class="v">${st.correct}</div><div class="l">${icon('check-circle-2',14)} صحيحة</div></div>
        <div class="statCard bad"><div class="v">${st.wrong}</div><div class="l">${icon('x-circle',14)} خاطئة</div></div>
        <div class="statCard"><div class="v">${fmtDur(dur)}</div><div class="l">${icon('timer',14)} الوقت</div></div>
        <div class="statCard"><div class="v">${acc}%</div><div class="l">${icon('target',14)} الدقة</div></div>
      </div>`;
  } else if(tab === 'wrong'){
    if(!wrong) body = emptyArt('star', 'لا توجد أخطاء — أداء مثالي!');
    else {
      const groups = new Map();
      q.wrongList.forEach(w => { const k = w.question.categoryId != null ? String(w.question.categoryId) : '__none__'; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(w); });
      body = Array.from(groups.entries()).map(([k, arr]) => `
        <div class="grpHead"><span class="nm" dir="auto">${esc(k === '__none__' ? 'بدون قسم' : catName(k))} — ${arr.length} خطأ</span>
          <button class="btn sm gold" onclick="retryWrongOnly('${escJs(k)}')">${icon('target',14)} تدرّب على هذا القسم</button></div>
        <div class="wrongList">${arr.map(w => `
          <div class="wrongItem">
            <div class="qt" dir="auto">${esc(w.question.question)}</div>
            <div class="ans" dir="auto">${icon('check',14)} الإجابة الصحيحة: ${esc(w.question.options[w.question.correct])}</div>
            <div class="mine" dir="auto">${icon('x',14)} إجابتك: ${esc(w.question.options[w.chosen])}</div>
          </div>`).join('')}</div>`).join('');
    }
  } else {
    const g = new Map();
    q.questions.forEach((qq, i) => {
      const k = qq.categoryId != null ? String(qq.categoryId) : '__none__';
      if(!g.has(k)) g.set(k, { t:0, c:0 });
      const o = g.get(k); o.t++;
      if((q.userAnswers || [])[i] === qq.correct) o.c++;
    });
    body = Array.from(g.entries()).map(([k, o]) => { const p = Math.round(o.c / o.t * 100); return `
      <div class="barRow"><div class="top"><span class="nm" dir="auto">${esc(k === '__none__' ? 'بدون قسم' : catName(k))}</span><span class="nu">${o.c} / ${o.t} — ${p}%</span></div>
      <div class="barTrack"><div class="barFill ${pctClass(p)}" style="width:${p}%"></div></div></div>`; }).join('');
  }

  return `
    ${renderTopbar(false)}
    ${q.sourceLabel ? `<div style="font-family:var(--font-head);font-size:13px;color:var(--gold);text-align:center;letter-spacing:.04em;" dir="auto">${esc(q.sourceLabel)}</div>` : ''}
    <div class="resultHero">
      <div class="ringWrap">
        <svg viewBox="0 0 120 120"><circle class="ringTrack" cx="60" cy="60" r="52"/><circle id="ringFg" class="ringFg ${pctClass(score)}" cx="60" cy="60" r="52" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" data-target="${target.toFixed(2)}"/></svg>
        <div class="ringCenter"><div class="pc">${score}%</div><div class="sub">النتيجة</div></div>
      </div>
      <div class="heroLines">
        <span><b>${st.correct}</b> / ${total} صحيحة</span>
        <span>الدقة <b>${acc}%</b></span>
        <span>الزمن <b>${fmtDur(dur)}</b></span>
        <span>متوسط السؤال <b>${fmtDur(avg)}</b></span>
      </div>
      ${st.left > 0 ? `<div class="scoreLabel" style="margin-top:8px;">لم تُحل: ${st.left} سؤال</div>` : ''}
    </div>
    <div class="rTabs">
      <button class="rTab ${tab==='summary'?'on':''}" onclick="setResultsTab('summary')">الملخص</button>
      <button class="rTab ${tab==='wrong'?'on':''}" onclick="setResultsTab('wrong')">الأخطاء (${wrong})</button>
      <button class="rTab ${tab==='dist'?'on':''}" onclick="setResultsTab('dist')">التوزيع</button>
    </div>
    ${body}
    <div class="resultActions" style="flex-direction:column;">
      ${wrong ? `<button class="btn primary block" onclick="retryWrongOnly()">${icon('target',15)} تدرّب على الأسئلة الخاطئة (${wrong})</button>` : ''}
      ${st.left > 0 ? `<button class="btn gold block" onclick="resumeUnanswered()">${icon('rotate-ccw',15)} حلّ الأسئلة المتبقية (${st.left})</button>` : ''}
      <button class="btn gold block" onclick="enterReviewMode()">${icon('book-open',15)} مراجعة كل الأسئلة</button>
      <button class="btn block" onclick="exitQuizToHome()">${icon('home',15)} العودة للرئيسية</button>
    </div>
  `;
}

function renderStats(){
  const s = state.stats;
  const acc = s.totalAnswered ? Math.round(s.totalCorrect / s.totalAnswered * 100) : 0;
  const DN = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  const days7 = [];
  for(let i = 6; i >= 0; i--){ const d = new Date(Date.now() - i * 86400000); const k = dayKey(d.getTime()); days7.push({ k, label: DN[d.getDay()], a: (s.dailyCounts[k] || {}).a || 0 }); }
  const max7 = Math.max(1, ...days7.map(d => d.a));
  const days30 = [];
  for(let i = 29; i >= 0; i--){ const k = dayKey(Date.now() - i * 86400000); days30.push((s.dailyCounts[k] || {}).a || 0); }
  const max30 = Math.max(1, ...days30);
  const pts = days30.map((v, i) => { const x = 300 - (i / 29) * 300; const y = 56 - (v / max30) * 50; return x.toFixed(1) + ',' + y.toFixed(1); }).join(' ');
  const cats = Object.keys(s.perCategory).filter(k => byId(k) && s.perCategory[k].a >= 10).map(k => ({ id:k, a:s.perCategory[k].a, acc: Math.round(s.perCategory[k].c / s.perCategory[k].a * 100) }));
  const best = cats.slice().sort((x,y) => y.acc - x.acc).slice(0, 3);
  const worst = cats.slice().sort((x,y) => x.acc - y.acc).slice(0, 3);
  const catRow = (c, cta) => `
    <div class="listRow"><div class="tx" dir="auto">${esc(catName(c.id))}<div class="mt">${c.a} إجابة</div></div>
      <span class="pill" style="${c.acc>=60?'border-color:var(--ok);color:var(--ok);':''}">${c.acc}%</span>
      ${cta ? `<button class="btn sm gold" onclick="startQuiz('${escJs(c.id)}', true)">تدرّب عليها</button>` : ''}</div>`;
  return `
    ${renderTopbar(false)}
    <div class="pageHead"><div class="wordmark">إحصائياتي</div><button class="btn ghost sm" onclick="goHomeRoot()">${icon('chevron-right',15)} رجوع</button></div>
    ${s.totalAnswered ? '' : emptyArt('chart', 'لا توجد إحصاءات بعد — ابدأ اختبارًا وستظهر هنا.')}
    <div class="statGrid">
      <div class="statCard"><div class="v">${s.totalAnswered}</div><div class="l">${icon('list-checks',14)} سؤال محلول</div></div>
      <div class="statCard ok"><div class="v">${acc}%</div><div class="l">${icon('target',14)} الدقة</div></div>
      <div class="statCard"><div class="v">${currentStreakShown()}</div><div class="l">${icon('flame',14)} السلسلة الحالية</div></div>
      <div class="statCard"><div class="v">${s.streak.longest}</div><div class="l">${icon('trophy',14)} الأطول</div></div>
    </div>
    <div class="secTitle">${icon('bar-chart-3',15)} آخر 7 أيام</div>
    <div class="dayBars">${days7.map(d => `<div class="dayCol"><div class="n">${d.a}</div><div class="bar" style="height:${Math.round(d.a / max7 * 70)}px"></div><div class="d">${d.label}</div></div>`).join('')}</div>
    <div class="secTitle">${icon('activity',15)} آخر 30 يومًا</div>
    <div class="sparkBox"><svg viewBox="0 0 300 60" preserveAspectRatio="none"><polyline points="${pts}" fill="none" style="stroke:var(--gold-bright)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>
    ${best.length ? `<div class="secTitle">${icon('trending-up',15)} أفضل الأقسام</div>${best.map(c => catRow(c, false)).join('')}` : ''}
    ${worst.length ? `<div class="secTitle">${icon('trending-down',15)} أضعف الأقسام</div>${worst.map(c => catRow(c, true)).join('')}` : ''}
    ${!cats.length && s.totalAnswered ? `<div class="emptyState" style="padding:16px;">تظهر الأقسام الأفضل/الأضعف بعد 10 إجابات على الأقل في القسم.</div>` : ''}
    <div class="secTitle">${icon('database',15)} النسخ الاحتياطي</div>
    <div class="quickBar" style="margin-top:0;">
      <button class="btn" onclick="openExportBackup()">${icon('download',15)} تصدير نسخة</button>
      <button class="btn" onclick="openImportBackup()">${icon('upload',15)} استيراد نسخة</button>
      <button class="btn danger" onclick="resetStats()">${icon('rotate-ccw',15)} تصفير الإحصاءات</button>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════
   FEATURE: BUSY BUTTONS (spinner + disabled on admin writes)
   ═══════════════════════════════════════════════════════════ */
function busyWrap(fn){
  return async function(...args){
    let btn = null;
    try{ const ev = window.event; if(ev && ev.target && ev.target.closest) btn = ev.target.closest('button'); }catch(e){ /* noop */ }
    let old = null;
    if(btn && !btn.disabled){ old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + old.replace(/<i [^>]*><\/i>|<svg[\s\S]*?<\/svg>/g, ''); }
    try{ return await fn.apply(this, args); }
    finally{ if(btn && btn.isConnected && old !== null){ btn.disabled = false; btn.innerHTML = old; refreshIcons(); } }
  };
}

/* ═══════════════════════════════════════════════════════════
   FEATURE: BUSY BUTTONS — تفعيل على عمليات الكتابة
   ═══════════════════════════════════════════════════════════ */
['addCategory','renameCategory','saveExamGroup','saveQuestionEdit','saveDescEditor','saveQuizTitleForCategory','renameQuestionSet','saveAnnouncementForm','broadcastNow','toggleShuffle'].forEach(name => {
  if(typeof window[name] === 'function') window[name] = busyWrap(window[name]);
});

   بدء التشغيل
   ══════════════════════════════════════════════════════════════════ */
state.stats = sanitizeStats(lsGet(STATS_KEY, null));
state.wrongBank = sanitizeWrongBank(lsGet(WRONG_KEY, null));
state.bookmarks = sanitizeBookmarks(lsGet(BM_KEY, null));
applyTheme();
loadAll();
syncFromCloud();
</script>
