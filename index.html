<!DOCTYPE html>
<!--
  Pseudoscience QBank — النسخة المطوّرة (ملف واحد)
  SQL (مرة واحدة فقط، اختياري للإشعارات) — Supabase → SQL Editor:
    ALTER TABLE app_meta ADD COLUMN IF NOT EXISTS announcements JSONB DEFAULT '[]'::jsonb;
  بدون هذا العمود كل شيء يعمل عدا الإشعارات (التطبيق يكتشف غيابه تلقائيًا).
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0908">
<meta name="color-scheme" content="dark light">
<title>Pseudoscience QBank</title>
<script>(function(){try{var p=localStorage.getItem('qbank_theme');var t=(p==='dark'||p==='light')?p:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  /* ============ design tokens ============ */
  :root,[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0b0908;
    --bg-deep:#050403;
    --panel:#14100a;
    --panel-2:#1b150d;
    --gold:#b8923f;
    --gold-bright:#e0bd6d;
    --gold-dim:#6e5726;
    --oxblood:#6b1620;
    --oxblood-bright:#9c2735;
    --sapphire:#33507a;
    --parchment:#ece4cf;
    --text-dim:#a89a7c;
    --danger:#c0394a;
    --ok:#4a8f5c;
    --radius:6px;
    --font-display:'Cinzel Decorative', serif;
    --font-head:'Cinzel', serif;
    --font-body:'Cairo', sans-serif;
    --gold-rgb:184,146,63; --ok-rgb:74,143,92; --danger-rgb:192,57,74; --sapphire-rgb:51,80,122; --oxblood-rgb:107,22,32; --overlay-rgb:5,4,3;
    --ok-text:#c9f0d1; --danger-text:#f5c3ca; --info-text:#c7d5ea; --ok-text2:#8fd19e; --danger-text2:#f08b98;
    --on-gold:#1a1206; --glow-a:.25;
  }
  [data-theme="light"]{
    color-scheme:light;
    --bg:#f7f2e7; --bg-deep:#efe7d3; --panel:#fffbf0; --panel-2:#f5eeda;
    --gold:#8a6914; --gold-bright:#a67c1a; --gold-dim:#c4a870;
    --oxblood:#6b1620; --oxblood-bright:#9c2735; --sapphire:#234a7a;
    --parchment:#2a1e0a; --text-dim:#6b5a3d; --ok:#2d6e3f; --danger:#a02535;
    --gold-rgb:138,105,20; --ok-rgb:45,110,63; --danger-rgb:160,37,53; --sapphire-rgb:35,74,122; --oxblood-rgb:107,22,32; --overlay-rgb:42,30,10;
    --ok-text:#1f5a31; --danger-text:#7a1a27; --info-text:#1d3b66; --ok-text2:#2d6e3f; --danger-text2:#a02535;
    --on-gold:#fffbf0; --glow-a:.07;
  }
  :root{ --app-max:720px; }
  @media (min-width:768px){ :root{ --app-max:820px; } }
  @media (min-width:1024px){ :root{ --app-max:960px; } }
  @media (min-width:1440px){ :root{ --app-max:1080px; } }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(var(--oxblood-rgb),var(--glow-a)), transparent 60%),
      radial-gradient(ellipse at 100% 100%, rgba(var(--sapphire-rgb),.12), transparent 55%),
      var(--bg-deep);
    color:var(--parchment);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  ::selection{background:var(--gold-dim);color:#fff;}

  /* ============ layout shell ============ */
  #app{max-width:min(100%,var(--app-max));margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(60px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .brandmini{font-family:var(--font-head);font-size:14px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;}
  .gearBtn{
    background:transparent;border:1px solid var(--gold-dim);color:var(--text-dim);
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:15px;transition:.2s;
  }
  .gearBtn:hover{border-color:var(--gold);color:var(--gold-bright);}

  /* ============ ornate divider (signature element) ============ */
  .divider{display:flex;align-items:center;gap:10px;margin:22px 0;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-dim) 40%, var(--gold-dim) 60%, transparent);}
  .divider .gem{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);
    box-shadow:0 0 10px 1px rgba(var(--gold-rgb),.7);flex:none;}

  /* ============ hero / emblem ============ */
  .hero{text-align:center;padding:26px 10px 8px;}
  .emblem{width:78px;height:78px;margin:0 auto 14px;position:relative;}
  .emblem svg{width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(var(--gold-rgb),.35));}
  .wordmark{
    font-family:var(--font-display);
    font-size:30px;color:var(--oxblood-bright);
    text-shadow:0 0 18px rgba(156,39,53,.45), 0 1px 0 rgba(0,0,0,.6);
    letter-spacing:.02em;
  }
  .subtitle{font-family:var(--font-head);font-size:12.5px;letter-spacing:.18em;color:var(--text-dim);
    text-transform:uppercase;margin-top:6px;}

  /* ============ breadcrumb ============ */
  .crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--text-dim);margin-bottom:14px;min-height:20px;}
  .crumbs button{background:none;border:none;color:var(--gold-bright);font-size:13px;padding:0;display:inline-flex;align-items:center;gap:4px;}
  .crumbs button:hover{text-decoration:underline;}
  .crumbs .sep{color:var(--gold-dim);}

  /* ============ ledger cards ============ */
  .ledger{display:flex;flex-direction:column;gap:10px;}
  .plaque{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--gold-dim);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    transition:.18s ease;
  }
  .plaque.clickable{cursor:pointer;}
  .plaque.clickable:hover{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-dim), 0 6px 18px -8px rgba(var(--gold-rgb),.35);transform:translateY(-1px);}
  .plaque .label{font-weight:700;font-size:15.5px;color:var(--parchment);}
  .plaque .meta{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .plaque .chev{color:var(--gold-dim);display:flex;align-items:center;}

  .emptyState{text-align:center;padding:40px 16px;color:var(--text-dim);font-size:14px;line-height:1.9;}

  /* ============ buttons ============ */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;border-radius:var(--radius);font-weight:700;font-size:14.5px;
    border:1px solid var(--gold-dim);background:transparent;color:var(--gold-bright);
    transition:.18s;
  }
  .btn:hover{border-color:var(--gold);background:rgba(var(--gold-rgb),.08);}
  .btn.primary{background:linear-gradient(180deg, var(--oxblood-bright), var(--oxblood));border-color:var(--oxblood-bright);color:#fff;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.gold{background:linear-gradient(180deg, var(--gold-bright), var(--gold));border-color:var(--gold-bright);color:var(--on-gold);}
  .btn.ghost{border-color:transparent;color:var(--text-dim);}
  .btn.danger{border-color:var(--danger);color:var(--danger);}
  .btn.danger:hover{background:rgba(var(--danger-rgb),.1);}
  .btn.block{width:100%;}
  .btn.sm{padding:7px 12px;font-size:13px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .startBar{margin-top:8px;padding:16px;border:1px dashed var(--gold-dim);border-radius:var(--radius);
    display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(var(--gold-rgb),.04);}
  .startBar .count{font-size:13px;color:var(--text-dim);}

  /* ============ info / description ============ */
  .infoBtn{background:none;border:1px solid var(--gold-dim);color:var(--text-dim);width:26px;height:26px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;transition:.15s;}
  .infoBtn:hover{color:var(--gold-bright);border-color:var(--gold);}

  .modalOverlay{position:fixed;inset:0;background:rgba(var(--overlay-rgb),.78);backdrop-filter:blur(2px);
    z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modalBox{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--gold);
    border-radius:8px;max-width:440px;width:100%;max-height:80vh;overflow:auto;padding:20px;
    box-shadow:0 10px 40px rgba(0,0,0,.6);}
  .modalHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;}
  .modalHead .mTitle{font-family:var(--font-head);font-size:17px;color:var(--gold-bright);font-weight:700;
    unicode-bidi:plaintext;display:flex;align-items:center;gap:8px;}
  .modalClose{background:none;border:1px solid var(--gold-dim);border-radius:50%;width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex:none;}
  .modalClose:hover{color:var(--gold-bright);border-color:var(--gold);}
  .modalMeta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .modalMeta .chip{font-size:11.5px;padding:5px 10px;border-radius:20px;border:1px solid var(--gold-dim);
    color:var(--text-dim);display:flex;align-items:center;gap:5px;}
  .modalDesc{font-size:14px;line-height:1.9;color:var(--parchment);unicode-bidi:plaintext;white-space:pre-wrap;}
  .modalDesc.empty{color:var(--text-dim);font-style:italic;font-size:13px;}

  /* ============ quiz ============ */
  .quizHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .progressWrap{flex:1;height:6px;background:var(--panel-2);border-radius:6px;margin:0 14px;overflow:hidden;border:1px solid var(--gold-dim);}
  .progressBar{height:100%;background:linear-gradient(90deg, var(--gold-dim), var(--gold-bright));transition:.3s;}
  .qCounter{font-family:var(--font-head);font-size:13px;color:var(--gold);white-space:nowrap;}

  .questionCard{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--gold-dim);border-radius:var(--radius);
    padding:22px 18px;margin-bottom:16px;
  }
  .questionText{font-size:17px;font-weight:700;line-height:1.8;color:var(--parchment);unicode-bidi:plaintext;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .optionBtn{
    text-align:start;padding:13px 16px;border-radius:var(--radius);
    border:1px solid var(--gold-dim);background:var(--panel-2);color:var(--parchment);
    font-size:14.5px;line-height:1.6;transition:.15s;unicode-bidi:plaintext;
  }
  .optionBtn:hover:not(:disabled){border-color:var(--gold);}
  .optionBtn.correct{border-color:var(--ok);background:rgba(var(--ok-rgb),.15);color:var(--ok-text);}
  .optionBtn.wrong{border-color:var(--danger);background:rgba(var(--danger-rgb),.15);color:var(--danger-text);}
  .optionBtn:disabled{cursor:default;}

  .explainBox{margin-top:14px;padding:12px 14px;border-radius:var(--radius);background:rgba(var(--sapphire-rgb),.12);
    border:1px solid var(--sapphire);font-size:13.5px;color:var(--info-text);line-height:1.8;unicode-bidi:plaintext;
    display:flex;gap:8px;align-items:flex-start;}

  .quizFooter{display:flex;justify-content:flex-end;margin-top:6px;}

  /* ============ results ============ */
  .resultHero{text-align:center;padding:20px 10px;}
  .scoreRing{font-family:var(--font-head);font-size:44px;color:var(--gold-bright);font-weight:700;}
  .scoreLabel{color:var(--text-dim);font-size:13px;margin-top:4px;}
  .wrongList{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .wrongItem{border:1px solid var(--danger);border-radius:var(--radius);padding:12px 14px;background:rgba(var(--danger-rgb),.07);}
  .wrongItem .qt{font-weight:700;font-size:14px;margin-bottom:8px;unicode-bidi:plaintext;}
  .wrongItem .ans{font-size:13px;color:var(--ok-text);unicode-bidi:plaintext;display:flex;align-items:center;gap:6px;}
  .resultActions{display:flex;gap:10px;margin-top:20px;}

  /* ============ forms / admin ============ */
  .field{margin-bottom:14px;}
  .field label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .field input[type=text],.field input[type=email],.field input[type=password],.field select,.field textarea{
    width:100%;padding:11px 12px;border-radius:var(--radius);border:1px solid var(--gold-dim);
    background:var(--panel-2);color:var(--parchment);font-size:14px;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold-dim);border-color:var(--gold);}
  .field textarea{min-height:160px;resize:vertical;font-family:'Courier New',monospace;font-size:13.5px;line-height:1.6;unicode-bidi:plaintext;}

  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--gold-dim);overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tabBtn{background:none;border:none;padding:10px 14px;color:var(--text-dim);font-weight:700;font-size:13.5px;
    border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px;}
  .tabBtn.active{color:var(--gold-bright);border-color:var(--gold-bright);}

  .treeNode{margin-inline-start:0;}
  .treeRow{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--gold-dim);
    border-radius:var(--radius);background:var(--panel-2);margin-bottom:6px;flex-wrap:wrap;}
  .treeRow .name{flex:1;font-size:14px;font-weight:600;unicode-bidi:plaintext;min-width:60px;}
  .treeChildren{margin-inline-start:22px;border-inline-start:1px dashed var(--gold-dim);padding-inline-start:12px;}
  .iconBtn{background:none;border:none;color:var(--text-dim);font-size:14px;padding:4px 6px;border-radius:4px;display:flex;align-items:center;}
  .iconBtn:hover{color:var(--gold-bright);background:rgba(var(--gold-rgb),.1);}
  .iconBtn.danger:hover{color:var(--danger);}

  .previewCard{border:1px solid var(--gold-dim);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;background:var(--panel-2);}
  .previewCard .qn{font-weight:700;font-size:13.5px;margin-bottom:6px;unicode-bidi:plaintext;}
  .previewCard .op{font-size:12.5px;color:var(--text-dim);padding:2px 0;unicode-bidi:plaintext;display:flex;align-items:center;gap:6px;}
  .previewCard .op.correct{color:var(--ok);font-weight:700;}
  .previewCard .rm{float:left;}

  .notice{padding:12px 14px;border-radius:var(--radius);font-size:13.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .notice.err{background:rgba(var(--danger-rgb),.12);border:1px solid var(--danger);color:var(--danger-text);}
  .notice.ok{background:rgba(var(--ok-rgb),.12);border:1px solid var(--ok);color:var(--ok-text);}
  .notice.info{background:rgba(var(--sapphire-rgb),.12);border:1px solid var(--sapphire);color:var(--info-text);}
  .notice.warn{background:rgba(var(--gold-rgb),.10);border:1px solid var(--gold-dim);color:var(--gold-bright);}

  .loadingDots{text-align:center;color:var(--text-dim);padding:40px 0;font-size:13px;letter-spacing:.1em;}

  .footNote{text-align:center;font-size:11px;color:var(--gold-dim);margin-top:30px;letter-spacing:.08em;}

  .pickerBox{max-height:260px;overflow:auto;border:1px solid var(--gold-dim);border-radius:6px;padding:6px;margin-bottom:10px;}
  .pickerRow{display:flex;align-items:flex-start;gap:8px;padding:8px 6px;border-bottom:1px solid rgba(var(--gold-rgb),.15);font-size:13px;cursor:pointer;}
  .pickerRow:last-child{border-bottom:none;}
  .pickerRow input{margin-top:3px;flex:none;width:16px;height:16px;}

  /* ============ category picker (new) ============ */
  .catPickBtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 12px;border-radius:var(--radius);border:1px solid var(--gold-dim);
    background:var(--panel-2);color:var(--parchment);font-size:14px;text-align:start;}
  .catPickBtn:hover{border-color:var(--gold);}
  .catPickBtn .ph{color:var(--text-dim);}
  .catPickModal{max-width:480px;}
  .catPickList{max-height:52vh;overflow:auto;border:1px solid var(--gold-dim);border-radius:6px;margin-top:10px;}
  .catPickRow{padding:11px 12px;border-bottom:1px solid rgba(var(--gold-rgb),.15);cursor:pointer;font-size:13.5px;}
  .catPickRow:last-child{border-bottom:none;}
  .catPickRow:hover{background:rgba(var(--gold-rgb),.08);}
  .catPickRow.sel{background:rgba(var(--gold-rgb),.15);}
  .catPickRow .pth{font-size:11px;color:var(--text-dim);margin-top:2px;unicode-bidi:plaintext;}
  .catPickRow .nm{font-weight:700;unicode-bidi:plaintext;}
  .setRow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--gold-dim);
    border-radius:var(--radius);background:var(--panel-2);margin-bottom:8px;}
  .setRow .nm{flex:1;font-weight:700;font-size:14px;unicode-bidi:plaintext;}
  .setRow .cnt{font-size:12px;color:var(--text-dim);}
  /* ===== التنقل السريع بين الأسئلة ===== */
  .qMeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-dim);margin:0 2px 8px;gap:10px;}
  .qMeta .st{display:flex;gap:10px;align-items:center;}
  .qMeta .ok{color:var(--ok-text2);} .qMeta .bad{color:var(--danger-text2);}
  .qStrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .qStrip::-webkit-scrollbar{display:none;}
  .qChip{flex:none;min-width:36px;height:36px;padding:0 6px;border-radius:8px;border:1px solid var(--gold-dim);background:var(--panel-2);
    color:var(--text-dim);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .qChip.correct{background:rgba(var(--ok-rgb),.22);border-color:var(--ok);color:var(--ok-text);}
  .qChip.wrong{background:rgba(var(--danger-rgb),.22);border-color:var(--danger);color:var(--danger-text);}
  .qChip.cur{outline:2px solid var(--gold-bright);outline-offset:1px;color:var(--gold-bright);transform:scale(1.08);}
  .qChip.correct.cur{color:var(--ok-text);} .qChip.wrong.cur{color:var(--danger-text);}
  .quizNav{display:flex;gap:10px;margin-top:18px;align-items:stretch;}
  .quizNav .btn{justify-content:center;}
  .quizNav .next{flex:1;}
  .quizNav .btn:disabled{opacity:.35;cursor:default;}
  .navOverlay{position:fixed;inset:0;background:rgba(var(--overlay-rgb),.7);backdrop-filter:blur(2px);z-index:9997;display:flex;align-items:flex-end;justify-content:center;animation:navFade .18s ease;}
  .navSheet{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--gold);border-bottom:none;border-radius:16px 16px 0 0;
    width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:16px 16px 22px;box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:navUp .22s ease;}
  @keyframes navUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes navFade{from{opacity:0}to{opacity:1}}
  .navHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .navHead .t{font-weight:700;font-size:15px;color:var(--gold-bright);}
  .navFilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .navFilters button{border:1px solid var(--gold-dim);background:transparent;color:var(--text-dim);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;}
  .navFilters button.on{background:rgba(var(--gold-rgb),.2);border-color:var(--gold);color:var(--gold-bright);}
  .navGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-bottom:14px;}
  .navGrid .qChip{width:100%;min-width:0;height:44px;font-size:14px;}
  .navActions{display:flex;flex-direction:column;gap:8px;}
  .navEmpty{grid-column:1/-1;text-align:center;color:var(--text-dim);font-size:13px;padding:14px 0;}
  /* ===== عرض الأسئلة بالإجابات ===== */

  /* ============ toast notifications ============ */
  #toastRoot{position:fixed;top:16px;left:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
  .toast{

  /* ═══════════════════════════════════════════════════════════

  .barRow{margin-bottom:12px;}

  .secTitle{font-family:var(--font-head);font-size:14px;color:var(--gold);margin:22px 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:.04em;}
  .dayBars{display:flex;align-items:flex-end;gap:8px;height:130px;padding:6px 4px 0;border:1px solid var(--gold-dim);border-radius:var(--radius);background:var(--panel-2);}
  .dayCol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0;}
  .dayCol .bar{width:70%;max-width:34px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--gold-bright),var(--gold-dim));min-height:2px;}
  .dayCol .n{font-size:11px;color:var(--text-dim);direction:ltr;}
  .dayCol .d{font-size:11px;color:var(--text-dim);padding-bottom:4px;white-space:nowrap;}
  .sparkBox{border:1px solid var(--gold-dim);border-radius:var(--radius);background:var(--panel-2);padding:10px;}
  .sparkBox svg{width:100%;height:70px;display:block;}
  .quickBar{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}

  .listRow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--gold-dim);border-radius:var(--radius);background:var(--panel-2);margin-bottom:8px;}
  .listRow .tx{flex:1;font-size:13.5px;unicode-bidi:plaintext;line-height:1.6;}
  .listRow .mt{font-size:11.5px;color:var(--text-dim);margin-top:2px;}

  .pageHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}

<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   أيقونات Lucide — دالة مساعدة موحّدة لكل الأيقونات بالتطبيق
   ══════════════════════════════════════════════════════════════════ */
function icon(name, size, extra){
  size = size || 16;
  return '<i data-lucide="'+name+'" style="width:'+size+'px;height:'+size+'px;display:inline-block;vertical-align:-3px;flex:none;'+(extra||'')+'"></i>';
}
function refreshIcons(){
  if(window.lucide){ try{ lucide.createIcons(); }catch(e){ /* noop */ } }
}

/* ══════════════════════════════════════════════════════════════════
   تكامل Telegram Mini App — زر الرجوع + الاهتزاز اللمسي
   ══════════════════════════════════════════════════════════════════ */
const TWA = window.Telegram && window.Telegram.WebApp;
if(TWA){
  try{
    TWA.ready();
    TWA.expand();
    if(TWA.setHeaderColor) TWA.setHeaderColor('#0b0908');
    if(TWA.setBackgroundColor) TWA.setBackgroundColor('#0b0908');
    if(TWA.BackButton) TWA.BackButton.onClick(() => handleBackButton());
  }catch(e){ /* noop */ }
}
function twaHaptic(type){
  try{ TWA && TWA.HapticFeedback && TWA.HapticFeedback.impactOccurred(type || 'light'); }catch(e){ /* noop */ }
}
function handleBackButton(){
  if(closeTopModal()) return;
  if(state.view === 'quiz' && state.navOpen){ toggleNav(false); return; }
  if(state.view === 'stats' || state.view === 'bookmarks' || state.view === 'wrongBank'){ goHomeRoot(); return; }
  if(state.view === 'study') exitStudy();
  else if(state.view === 'quiz') exitQuizToHome();
  else if(state.view === 'review') exitReviewToResults();
  else if(state.view === 'results') exitQuizToHome();
  else if(state.view === 'admin') goHomeRoot();
  else if(state.view === 'adminLogin') goHomeRoot();
  else if(state.path.length > 0){ state.path.pop(); render(); }
}
function updateTwaBackButton(){
  try{
    if(!TWA || !TWA.BackButton) return;
    const show = state.view !== 'home' && state.view !== 'loading';
    if(show) TWA.BackButton.show(); else TWA.BackButton.hide();
  }catch(e){ /* noop */ }
}

/* ══════════════════════════════════════════════════════════════════
   إشعارات Toast خفيفة (تختفي تلقائيًا)
   ══════════════════════════════════════════════════════════════════ */
function showToast(message, type, duration){
  type = type || 'info';
  duration = duration || 2600;
  const root = document.getElementById('toastRoot');
  if(!root) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const iconMap = { err:'alert-circle', ok:'check-circle', info:'info' };
  el.innerHTML = icon(iconMap[type] || 'info', 16) + '<span dir="auto">' + esc(message) + '</span>';
  root.appendChild(el);
  refreshIcons();
  setTimeout(() => {
    el.style.animation = 'toastOut .2s ease both';
    setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 200);
  }, duration);
}

/* ══════════════════════════════════════════════════════════════════
   شريط تشخيص الأخطاء المرئي — يظهر أي خطأ برمجي أو خطأ من Supabase
   مباشرة على الشاشة (مفيد جداً لأن لا يوجد وصول لأدوات المطوّر على الموبايل)
   ══════════════════════════════════════════════════════════════════ */
window.__debugLogs = [];

function ensureDebugPanel(){
  let wrap = document.getElementById('debugWrap');
  if(wrap) return wrap;

  wrap = document.createElement('div');
  wrap.id = 'debugWrap';
  wrap.style.cssText = 'position:fixed;bottom:14px;left:14px;z-index:99999;direction:ltr;font-family:monospace;';

  const toggle = document.createElement('button');
  toggle.id = 'debugToggle';
  toggle.type = 'button';
  toggle.style.cssText = 'width:38px;height:38px;border-radius:50%;border:1px solid #9c2735;background:#3a0000;color:#fff;font-size:15px;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5);position:relative;display:flex;align-items:center;justify-content:center;';
  toggle.innerHTML = icon('alert-triangle', 17);
  const badge = document.createElement('span');
  badge.id = 'debugCount';
  badge.style.cssText = 'position:absolute;top:-6px;right:-6px;background:#c0394a;color:#fff;border-radius:10px;min-width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 3px;';
  badge.textContent = '0';
  toggle.appendChild(badge);

  const panel = document.createElement('div');
  panel.id = 'debugPanel';
  panel.style.cssText = 'display:none;position:fixed;bottom:60px;left:14px;right:14px;max-width:460px;max-height:42vh;overflow:auto;background:#2a0000;color:#fff;font-size:11px;line-height:1.5;border:1px solid #9c2735;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.6);';

  const header = document.createElement('div');
  header.style.cssText = 'position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;background:#3a0000;padding:8px 10px;border-bottom:1px solid #660000;';
  header.innerHTML = '<span style="font-weight:bold;">سجل الأخطاء (أدمن)</span>';
  const btns = document.createElement('div');
  btns.style.cssText = 'display:flex;gap:6px;';
  const clearBtn = document.createElement('button');
  clearBtn.type = 'button';
  clearBtn.style.cssText = 'background:none;border:1px solid #9c2735;color:#fff;border-radius:4px;font-size:10px;padding:3px 8px;cursor:pointer;display:flex;align-items:center;';
  clearBtn.innerHTML = icon('rotate-ccw', 12) + '<span style="margin-inline-start:4px;">مسح</span>';
  clearBtn.onclick = () => { window.__debugLogs = []; renderDebugLines(); updateDebugBadge(); };
  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.style.cssText = 'background:none;border:1px solid #9c2735;color:#fff;border-radius:4px;font-size:10px;padding:3px 8px;cursor:pointer;display:flex;align-items:center;';
  closeBtn.innerHTML = icon('x', 12);
  closeBtn.onclick = () => { panel.style.display = 'none'; };
  btns.appendChild(clearBtn); btns.appendChild(closeBtn);
  header.appendChild(btns);

  const lines = document.createElement('div');
  lines.id = 'debugLines';
  lines.style.cssText = 'padding:8px;';

  panel.appendChild(header);
  panel.appendChild(lines);

  toggle.onclick = () => {
    panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
  };

  wrap.appendChild(panel);
  wrap.appendChild(toggle);
  (document.body || document.documentElement).appendChild(wrap);
  refreshIcons();
  return wrap;
}

function updateDebugBadge(){
  const badge = document.getElementById('debugCount');
  if(badge) badge.textContent = String(window.__debugLogs.length);
}

function renderDebugLines(){
  const lines = document.getElementById('debugLines');
  if(!lines) return;
  lines.innerHTML = window.__debugLogs.map(m =>
    '<div style="border-bottom:1px solid #660000;padding:5px 0;white-space:pre-wrap;word-break:break-word;display:flex;gap:6px;align-items:flex-start;">'+icon('alert-triangle',13)+'<span>'+m.time+' — '+esc(m.msg)+'</span></div>'
  ).join('') || '<div style="color:#c9a; padding:6px 0;">لا توجد رسائل.</div>';
  refreshIcons();
}

window.__debugLog = function(msg){
  try{ console.warn('[QBank]', msg); }catch(e){ /* noop */ }
  const text = String(msg);
  window.__debugLogs.push({ time: new Date().toLocaleTimeString(), msg: text });
  if(window.__debugLogs.length > 200) window.__debugLogs.shift();
  try{
    if(typeof state === "undefined" || !state.adminSession) return;
    ensureDebugPanel();
    renderDebugLines();
    updateDebugBadge();
  }catch(e){ /* noop */ }
};
window.addEventListener('error', function(e){
  window.__debugLog('JS Error: ' + (e.message||e) + (e.filename?(' @ '+e.filename+':'+e.lineno):''));
});

const CACHE_KEY = "qbank_cache_v1";

function readCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.updatedAt) return null;
    return parsed;
  }catch(e){ return null; }
}
function writeCache(categories, examGroups, updatedAt, questionSets){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      updatedAt,
      categories,
      examGroups,
      questionSets,
    }));
  }catch(e){ /* noop */ }
}
function clearCache(){
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){ /* noop */ }
}

async function fetchServerUpdatedAt(){
  let res = await sb.from("app_meta").select("updated_at,announcements").eq("id", 1).single();
  if(res.error && /announcements/i.test(res.error.message || "")){
    state.annColumnMissing = true;

  if(res.error) throw res.error;
  state.announcements = Array.isArray(res.data.announcements) ? res.data.announcements : [];
  return res.data.updated_at;
}

function byId(id){ return state.categories.find(c => c.id === id); }
function childrenOf(parentId){
  return state.categories
    .filter(c => c.parent_id === parentId)
    .sort((a,b) => (a.sort_order||0) - (b.sort_order||0) || a.name.localeCompare(b.name,'ar'));
}
function descendantIds(rootId){
  const seen = new Set([rootId]);
  const out = [rootId];
  const stack = [rootId];
  while(stack.length){
    const cur = stack.pop();
    for(const c of childrenOf(cur)){
      if(seen.has(c.id)) continue;
      seen.add(c.id);
      out.push(c.id);
      stack.push(c.id);
    }
  }
  return out;
}
function nodeHasQuestions(id){
  return nodeQuestionCount(id) > 0;
}
function directQuestionCount(id){
  const c = byId(id);
  return c ? (c.direct_question_count || 0) : 0;
}
function nodeQuestionCount(id){
  return descendantIds(id).reduce((sum, id2) => sum + directQuestionCount(id2), 0);
}
function examGroupsFor(categoryId){
  return state.examGroups
    .filter(g => (g.attach_to || null) === (categoryId || null))
    .sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
}
function setsForCategory(categoryId){

    .filter(s => s.category_id === categoryId)

}

}

async function selectWithFallback(table, cols, optional){
  const run = (c) => pagedSelect((a,b) => sb.from(table).select(c).order("id",{ascending:true}).range(a,b));
  let r = await run(cols);
  if(r.error && /column|does not exist|42703/i.test((r.error.message || "") + (r.error.code || ""))){
    r = await run(cols.split(",").filter(c => !optional.includes(c)).join(","));
  }
  return r;
}

    }
  }

  try{

      selectWithFallback("categories", "id,parent_id,name,sort_order,direct_question_count,description,quiz_title,shuffle_questions", ["shuffle_questions"]),
      selectWithFallback("exam_groups", "id,title,description,attach_to,category_ids,question_ids,sort_order,shuffle_questions", ["shuffle_questions"]),
      selectWithFallback("question_sets", "id,category_id,title,sort_order,shuffle_questions", ["shuffle_questions"]),
      fetchServerUpdatedAt().catch(()=>null),
    ]);
    if(e1) throw e1;
    if(e3) throw e3;
    if(e4) throw e4;
    state.categories = (cats || []).map(c => ({
      ...c,

    state.examGroups = (groups || []).map(g => ({
      ...g,
      id: String(g.id),
      attach_to: (g.attach_to === null || g.attach_to === undefined) ? null : String(g.attach_to),
      category_ids: (g.category_ids || []).map(String),
      question_ids: (g.question_ids || []).map(String),
      description: g.description || "",
      shuffle_questions: g.shuffle_questions !== false,

    state.questionSets = (sets || []).map(s => ({
      ...s,
      id: String(s.id),
      category_id: String(s.category_id),
      title: s.title || "",
      shuffle_questions: s.shuffle_questions !== false,
    }));
    state.setCounts = {};
    writeCache(state.categories, state.examGroups, latestUpdatedAt, state.questionSets);
    window.__debugLog('loadAll ok (من قاعدة البيانات مباشرة) — categories: ' + state.categories.length + ', exam groups: ' + state.examGroups.length + ', question sets: ' + state.questionSets.length + '.');

    state.resumeAvailable = readProgress();

    state.notice = state.adminSession ? (err.message || String(err)) : "تعذّر تحميل البيانات حالياً، حاول مرة أخرى بعد قليل.";

  }

/* ══════════════════════════════════════════════════════════════════
   محلّل النصوص إلى أسئلة
   ══════════════════════════════════════════════════════════════════ */
function parseQuestionsFromText(raw){
  const AR_MAP = {"أ":0,"ا":0,"ب":1,"ج":2,"د":3,"هـ":4,"ه":4,"و":5};

  const OPT_LATIN = /^(?:([A-Ja-j])\s*[.):\-]\s*|\(([A-Ja-j])\)\s*)(.*)$/;
  const OPT_ARABIC = /^(أ|ا|ب|ج|د|هـ|ه|و)\s*[.)\-:]\s*(.*)$/;
  const INLINE_OPT_RE = /([A-Ja-j])\s*[.)]\s*(.*?)(?=\s+[A-Ja-j]\s*[.)]|$)/gi;

  const ANSWER_KEY = /^(?:Correct\s*Answer|Answers?|Ans|Correct|الإجابة\s*الصحيحة?|الإجابة|الجواب|الحل)\s*[:=\-]\s*(.+)$/i;
  const EXPLANATION_KEY = /^(?:Explanation|Explain|Rationale|Note|ملاحظة|التفسير|السبب|التوضيح|توضيح|الشرح|شرح)\s*[:=\-]\s*(.+)$/i;
  const QNUM = /^(?:Q(?:uestion)?s?\.?\s*)?(\d+)\s*[.)\-:؟]\s*(.*)$/i;
  const TF_WORD = /^(صح|خطأ|True|False)$/i;
  const LONE_LETTER_LATIN = /^([A-Ja-j])$/;
  const LONE_LETTER_ARABIC = /^(أ|ا|ب|ج|د|هـ|ه|و)$/;
  const DIVIDER = /^[-_=*#]{3,}\s*$/;
  const STEM_START = /^(?:Which|What|Who|When|Where|How|Why|Choose|Select|True|False|ما|من|أي|اختر|حدد|صح|خطأ|هل)\b/i;

  const KEY_HDR = /^(?:answers?\s*key|key|answers?|الإجابات?|مفتاح\s*الإجابات?)\s*:?\s*$/i;
  const KEY_LINE = /^(\d+)\s*[-.):\s]\s*([A-Ja-j])\s*$/i;

  const ALL_PAT = /^(?:ALL(?:\s+OF\s+(?:THE\s+)?ABOVE)?|كل\s*(?:ما\s*)?(?:سبق|ذكر)|جميع\s*(?:ما\s*)?(?:سبق|ذكر)|كلها|كلهم|جميعها|جميعهم|كل\s*الخيارات?\s*(?:صحيحة|صحيح)?)$/i;
  const NONE_PAT = /^(?:NONE(?:\s+OF\s+(?:THE\s+)?ABOVE)?|لا\s*شيء(?:\s*مما\s*(?:سبق|ذكر))?|لا\s*(?:شيء|إجابة)\s*(?:من\s*)?(?:ما\s*)?(?:سبق|صحيحة?)?)$/i;
  const MULTI_LETTER_PAT = /^[A-Ja-j](?:\s*(?:and|or|و|،|,|&|\+|\/)\s*[A-Ja-j])+$/i;

  function cleanOption(o){
    return o.trim().replace(/\s*\.{2,}\s*$/,"").replace(/\s*\.\s*$/,"").replace(/\s+/g," ").trim();
  }

  function parseAnswerValue(raw){
    const s = raw.trim();
    if(ALL_PAT.test(s)) return "ALL";
    if(NONE_PAT.test(s)) return "NONE";
    if(MULTI_LETTER_PAT.test(s)){
      const letters = (s.match(/[A-Ja-j]/g) || []).map(l=>l.toUpperCase());
      const unique = [...new Set(letters)];
      if(unique.length > 1) return "MULTI:" + unique.join("");
    }
    for(const [ar, idx] of Object.entries(AR_MAP)){
      if(s === ar) return idx;
    }
    const single = s.match(/^([A-Ja-j])\s*$/i);
    if(single) return single[1].toUpperCase().charCodeAt(0) - 65;
    const n = parseInt(s,10);
    if(!isNaN(n) && String(n) === s) return n - 1;
    return null;
  }

  function buildMultiOption(opts, letters){
    const label = letters.split("").join(" & ");
    const combo = `(${label}) كلاهما صحيح`;
    const newOpts = opts.map(cleanOption).concat([combo]);
    return { options: newOpts, correct: newOpts.length - 1 };
  }

  function matchOption(line){
    const mLat = line.match(OPT_LATIN);
    if(mLat) return { text: (mLat[3]||"").trim() };
    const mAr = line.match(OPT_ARABIC);
    if(mAr) return { text: (mAr[2]||"").trim() };
    return null;
  }
  function parseInlineOptions(line){
    const matches = [...line.matchAll(INLINE_OPT_RE)];
    if(matches.length >= 2) return matches.map(m => cleanOption(m[2]));
    return null;
  }

  const lines = raw.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");

  const answerKeyMap = {};
  const keyLineIdx = new Set();
  let inKey = false;
  for(let i=0;i<lines.length;i++){
    const s = lines[i].trim();
    if(KEY_HDR.test(s)){ inKey = true; keyLineIdx.add(i); continue; }
    if(inKey){
      const mk = s.match(KEY_LINE);
      if(mk){ answerKeyMap[parseInt(mk[1],10)] = mk[2].toUpperCase(); keyLineIdx.add(i); }
      else if(s && !DIVIDER.test(s)){ inKey = false; }
    }
  }
  const useAnswerKey = keyLineIdx.size >= 3;

  const questions = [];
  let curLines = [], curOpts = [], curAns = null, curExpl = null, curNum = null;
  let autoCtr = 0;

  function resetCur(){ curLines=[]; curOpts=[]; curAns=null; curExpl=null; curNum=null; }

  function flush(){
    if(!curLines.length) return;
    if(curAns === null && curNum !== null && useAnswerKey && answerKeyMap[curNum]){
      curAns = answerKeyMap[curNum].toUpperCase().charCodeAt(0) - 65;
    }
    if(curAns === null || curOpts.length < 2) return;

    const qText = curLines.join(" ").trim();
    const cleaned = curOpts.map(cleanOption);

    function add(opts, correct){
      if(opts.length >= 2 && correct < opts.length){
        questions.push({ question: qText, options: opts, correct, explanation: curExpl ? curExpl.trim() : null });
      }
    }

    if(curAns === "ALL"){
      add(cleaned.concat(["كل ما سبق"]), cleaned.length);
    } else if(curAns === "NONE"){
      add(cleaned.concat(["لا شيء مما سبق"]), cleaned.length);
    } else if(typeof curAns === "string" && curAns.startsWith("MULTI:")){
      const built = buildMultiOption(curOpts, curAns.slice(6));
      add(built.options, built.correct);
    } else if(typeof curAns === "number"){
      add(cleaned, curAns);
    }
  }

  for(let i=0;i<lines.length;i++){
    if(keyLineIdx.has(i)) continue;
    const line = lines[i].trim();

    if(!line || DIVIDER.test(line)){
      if(curAns !== null && curOpts.length){ flush(); resetCur(); }
      continue;
    }
    if(KEY_HDR.test(line)){
      if(curLines.length){ flush(); resetCur(); }
      continue;
    }

    const mExp = line.match(EXPLANATION_KEY);
    if(mExp){ curExpl = mExp[1]; continue; }

    const mQ = line.match(QNUM);
    if(mQ && !ANSWER_KEY.test(line)){
      flush();
      autoCtr++;
      resetCur();
      curNum = parseInt(mQ[1],10);
      curLines = [(mQ[2]||"").trim()];
      continue;
    }

    const mAns = line.match(ANSWER_KEY);
    if(mAns){
      curAns = parseAnswerValue(mAns[1]);
      continue;
    }

    const optMatch = matchOption(line);
    if(optMatch){
      const inline = parseInlineOptions(line);
      if(inline){ curOpts = inline; }
      else { curOpts.push(optMatch.text); }
      continue;
    }

    if(curOpts.length >= 2 && curAns === null){
      if(LONE_LETTER_LATIN.test(line)){ curAns = line.toUpperCase().charCodeAt(0)-65; continue; }
      if(LONE_LETTER_ARABIC.test(line)){ curAns = AR_MAP[line]; continue; }
    }

    if(curOpts.length === 0 && TF_WORD.test(line) && curLines.length){
      const isTrue = /^(صح|True)$/i.test(line);
      curOpts = [isTrue ? "صح" : "خطأ", isTrue ? "خطأ" : "صح"];
      curAns = 0;
      continue;
    }

    if(curOpts.length && curAns === null){
      const inline = parseInlineOptions(line);
      if(inline){ curOpts = inline; }
      else { curOpts[curOpts.length-1] += " " + line; }
      continue;
    }

    if(curLines.length && curAns === null && curOpts.length === 0){
      curLines.push(line);
      continue;
    }

    if(STEM_START.test(line)){
      flush();
      autoCtr++;
      resetCur();
      curNum = autoCtr;
      curLines = [line];
      continue;
    }

    if(!curLines.length){
      resetCur();
      curLines = [line];
    }
  }
  flush();
  return questions;
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function cmpId(a,b){
  const x=Number(a), y=Number(b);
  if(!isNaN(x) && !isNaN(y)) return x-y;
  a=String(a); b=String(b);
  return a<b ? -1 : a>b ? 1 : 0;
}
/* معرّف UUID مرتّب زمنيًا (v7) ليحافظ على ترتيب الأسئلة كما استُخرجت */
function seqUuid(base, i){
  const ms = base + Math.floor(i/4096);
  const seq = i % 4096;
  const r = new Uint8Array(8); crypto.getRandomValues(r);
  const h = Array.from(r, v => v.toString(16).padStart(2,'0')).join('');
  const ts = ms.toString(16).padStart(12,'0');
  const variant = (8 + (r[0] & 3)).toString(16);
  return ts.slice(0,8)+'-'+ts.slice(8,12)+'-7'+seq.toString(16).padStart(3,'0')+'-'+variant+h.slice(1,4)+'-'+h.slice(4,16);
}
/* ترتيب الأسئلة: عشوائي إن كان الخيار مفعّلاً، وإلا بترتيب الإضافة (وبترتيب groupOrder للأقسام إن وُجد) */
function orderRows(rows, shuffle, groupOrder, seed){
  if(shuffle){
    const base = rows.slice().sort((a,b) => cmpId(a.id,b.id));
    return seededShuffle(base, seed != null ? seed : Math.floor(Math.random()*2147483647));
  }
  const pos = new Map((groupOrder||[]).map((id,i)=>[String(id),i]));
  const big = 1e9;
  return rows.slice().sort((a,b)=>{
    const pa = pos.has(String(a.category_id)) ? pos.get(String(a.category_id)) : big;
    const pb = pos.has(String(b.category_id)) ? pos.get(String(b.category_id)) : big;
    return (pa-pb) || cmpId(a.id,b.id);
  });
}
function isShuffleOn(kind,id){
  let o = null;
  if(kind==='category') o = byId(String(id));
  else if(kind==='set') o = state.questionSets.find(x=>x.id===String(id));
  else o = state.examGroups.find(x=>x.id===String(id));
  return !o || o.shuffle_questions !== false;
}
function shufBtn(kind,id){
  const on = isShuffleOn(kind,id);
  return `<button class="shufBtn ${on?'on':'off'}" title="ترتيب الأسئلة عشوائيًا — اضغط للتبديل" onclick="toggleShuffle('${kind}','${id}')">${icon('shuffle',13)} ${on?'عشوائي':'مرتّب'}</button>`;
}
async function toggleShuffle(kind,id){
  const value = !isShuffleOn(kind,id);
  const table = kind==='category' ? 'categories' : kind==='set' ? 'question_sets' : 'exam_groups';
  const { error } = await sb.from(table).update({ shuffle_questions: value }).eq('id', id);
  if(error){
    const msg = /shuffle_questions/.test(error.message||"") ? "لم يتم إنشاء عمود الترتيب العشوائي في قاعدة البيانات بعد. نفّذ كود SQL المرفق أولاً." : error.message;
    state.notice = msg; showToast(msg,'err'); render(); return;
  }
  const list = kind==='category' ? state.categories : kind==='set' ? state.questionSets : state.examGroups;
  const o = list.find(x=>x.id===String(id));
  if(o) o.shuffle_questions = value;
  clearCache();
  await bumpServerUpdatedAt();
  showToast(value ? "تم تفعيل الترتيب العشوائي" : "تم إيقاف الترتيب العشوائي (ترتيب ثابت)", "ok");
  render();
}
window.toggleShuffle = toggleShuffle;

function quizLoadError(where, error){
  window.__debugLog(where + ' error: ' + error.message + ' | code: ' + (error.code||''));
  state.notice = state.adminSession ? ("خطأ أثناء تحميل الأسئلة: " + error.message) : "تعذّر تحميل الأسئلة، حاول مرة أخرى.";
  render();
}
async function startSetQuiz(categoryId, setId, studyOnly, resume){
  try{
    const { data, error } = await pagedSelect((a,b) => {
      let query = sb.from("questions").select(Q_COLS).eq("category_id", String(categoryId));
      query = setId ? query.eq("set_id", setId) : query.is("set_id", null);
      return query.order("id",{ascending:true}).range(a,b);
    });
    if(error){ quizLoadError('startSetQuiz', error); return; }
    if(!data || !data.length){
      state.notice = "لا توجد أسئلة في هذا الاختبار بعد.";
      render();
      return;
    }
    const seed = resume ? resume.seed : Math.floor(Math.random()*2147483647);
    const questions = orderRows(data, studyOnly ? false : (setId ? isShuffleOn('set', setId) : isShuffleOn('category', categoryId)), null, seed).map(mapQuestionRow);
    const catObj = byId(String(categoryId)) || {};
    let label = catObj.quiz_title || "الاختبار الرئيسي";
    if(setId){
      const setObj = state.questionSets.find(s => s.id === String(setId));
      label = setObj ? setObj.title : "اختبار";
    }
    if(studyOnly){ openStudy(questions, label, () => startSetQuiz(categoryId, setId)); return; }
    launchQuiz({
      questions, index:0, correct:0, wrongList:[], answered:false, selected:null,
      userAnswers: new Array(questions.length).fill(null),
      sourceLabel: label, seed,
      sourceType: "questionSet", sourceCategoryId: String(categoryId), sourceSetId: setId ? String(setId) : null,
    }, resume);
  }catch(err){
    window.__debugLog('startSetQuiz exception: ' + (err.message || JSON.stringify(err)));
    state.notice = "حدث خطأ غير متوقع، حاول مرة أخرى.";
    render();
  }
}

async function startQuiz(nodeId, includeSub, studyOnly, resume){
  try{
    let res;
    if(includeSub){
      const ids = Array.from(new Set(descendantIds(String(nodeId))));
      res = await selectIn("questions", Q_COLS, "category_id", ids);
    } else {
      res = await pagedSelect((a,b) => sb.from("questions").select(Q_COLS).eq("category_id", String(nodeId)).order("id",{ascending:true}).range(a,b));
    }
    const { data, error } = res;
    if(error){ quizLoadError('startQuiz', error); return; }
    if(!data || !data.length){
      window.__debugLog('startQuiz: query succeeded but returned 0 rows. mode: ' + (includeSub?'includeSub':'direct') + ', node id: ' + nodeId + '.');
      state.notice = "لا توجد أسئلة في هذا القسم بعد.";
      render();
      return;
    }
    const seed = resume ? resume.seed : Math.floor(Math.random()*2147483647);
    const questions = orderRows(data, studyOnly ? false : isShuffleOn('category', nodeId), includeSub ? descendantIds(String(nodeId)) : null, seed).map(mapQuestionRow);
    const catObj = byId(String(nodeId)) || {};
    const catName = catObj.quiz_title || catObj.name || "";
    if(studyOnly){ openStudy(questions, catName + (includeSub ? " (شامل)" : ""), () => startQuiz(nodeId, includeSub)); return; }
    launchQuiz({
      questions, index:0, correct:0, wrongList:[], answered:false, selected:null,
      userAnswers: new Array(questions.length).fill(null),
      sourceLabel: catName + (includeSub ? " (شامل)" : ""), seed,
      sourceType: "category", sourceNodeId: String(nodeId), sourceIncludeSub: !!includeSub,
    }, resume);
  }catch(err){
    console.error("startQuiz exception:", err);
    window.__debugLog('startQuiz exception: ' + (err.message || JSON.stringify(err)));
    state.notice = state.adminSession ? ("حدث خطأ غير متوقع أثناء بدء الاختبار: " + (err.message || String(err))) : "حدث خطأ غير متوقع، حاول مرة أخرى.";
    render();
  }
}

async function startCustomExam(groupId, studyOnly, resume){
  const group = state.examGroups.find(g => g.id === groupId);
  const hasCats = group && group.category_ids && group.category_ids.length;
  const hasQs = group && group.question_ids && group.question_ids.length;
  if(!group || (!hasCats && !hasQs)){
    state.notice = "هذا الامتحان الشامل غير مُعد بشكل صحيح.";
    render();
    return;
  }
  try{
    let rows = [];
    if(hasCats){
      const { data, error } = await selectIn("questions", Q_COLS, "category_id", group.category_ids);
      if(error){ quizLoadError('startCustomExam categories', error); return; }
      rows = rows.concat(data || []);
    }
    if(hasQs){
      const { data, error } = await selectIn("questions", Q_COLS, "id", group.question_ids);
      if(error){ quizLoadError('startCustomExam question_ids', error); return; }
      rows = rows.concat(data || []);
    }
    const map = new Map();
    rows.forEach(r => map.set(String(r.id), r));
    const data = Array.from(map.values());
    if(!data.length){
      state.notice = "لا توجد أسئلة بعد بهذا الامتحان الشامل.";
      render();
      return;
    }
    const seed = resume ? resume.seed : Math.floor(Math.random()*2147483647);
    const questions = orderRows(data, studyOnly ? false : isShuffleOn('exam', groupId), group.category_ids, seed).map(mapQuestionRow);
    if(studyOnly){ openStudy(questions, group.title, () => startCustomExam(groupId)); return; }
    launchQuiz({
      questions, index:0, correct:0, wrongList:[], answered:false, selected:null,
      userAnswers: new Array(questions.length).fill(null),
      sourceLabel: group.title, seed,
      sourceType: "examGroup", sourceGroupId: groupId,
    }, resume);
  }catch(err){
    window.__debugLog('startCustomExam exception: ' + (err.message || JSON.stringify(err)));
    state.notice = "حدث خطأ غير متوقع، حاول مرة أخرى.";
    render();
  }
}

/* ══════════════════════════════════════════════════════════════════
   اختيار القسم — نافذة بحث احترافية (بديل القائمة الطويلة)
   ══════════════════════════════════════════════════════════════════ */
state.catPicker = { open:false, currentValue:null, search:"", onSelect:null, allowNull:false, nullLabel:"", browsePath:[] };

function categoryPath(id){
  const names = [];
  let cur = byId(id);
  let guard = 0;
  while(cur && guard < 60){
    names.unshift(cur.name);
    cur = cur.parent_id ? byId(cur.parent_id) : null;
    guard++;
  }
  return names.join(" › ");
}
function allCategoriesFlat(){
  return state.categories.slice().sort((a,b) => categoryPath(a.id).localeCompare(categoryPath(b.id),'ar'));
}
window.openCategoryPicker = (currentValue, onSelectCb, opts) => {
  opts = opts || {};
  // إذا كان هناك قسم مختار مسبقاً، افتح المتصفح على مساره مباشرة (أسهل للتعديل)
  let startPath = [];
  if(currentValue){
    let cur = byId(currentValue);
    const chain = [];
    let guard = 0;
    while(cur && cur.parent_id && guard < 60){
      const parent = byId(cur.parent_id);
      if(parent) chain.unshift({ id: parent.id, name: parent.name });
      cur = parent;
      guard++;
    }
    startPath = chain;
  }
  state.catPicker = {
    open:true, currentValue: currentValue||null, search:"",
    onSelect: onSelectCb, allowNull: !!opts.allowNull, nullLabel: opts.nullLabel || "بدون قسم",
    browsePath: startPath,
  };
  renderModalRoot();
};
window.closeCategoryPicker = () => { state.catPicker.open = false; renderModalRoot(); };
window.setCatPickerSearch = (val) => { state.catPicker.search = val; renderModalRoot(); };
window.catPickerEnter = (id, name) => {
  state.catPicker.browsePath.push({ id, name });
  state.catPicker.search = "";
  renderModalRoot();
};
window.catPickerCrumb = (i) => {
  state.catPicker.browsePath = state.catPicker.browsePath.slice(0, i+1);
  renderModalRoot();
};
window.catPickerCrumbRoot = () => {
  state.catPicker.browsePath = [];
  renderModalRoot();
};
window.selectFromCategoryPicker = (id) => {
  const cb = state.catPicker.onSelect;
  state.catPicker.open = false;
  renderModalRoot();
  if(cb) window[cb](id || null);
};
function renderCatPickerModalHtml(){
  const p = state.catPicker;
  const q = (p.search || "").trim().toLowerCase();

  // ── وضع البحث الفوري: نتيجة مسطّحة عبر كل الأقسام ──
  if(q){
    let items = allCategoriesFlat().map(c => ({ id:c.id, name:c.name, path: categoryPath(c.id), qCount: directQuestionCount(c.id), subCount: descendantIds(c.id).length - 1 }));
    items = items.filter(it => it.name.toLowerCase().includes(q) || it.path.toLowerCase().includes(q));
    const CAP = 40;
    const shown = items.slice(0, CAP);
    return `
      <div class="modalOverlay" onclick="if(event.target===this) closeCategoryPicker()">
        <div class="modalBox catPickModal">
          <div class="modalHead">
            <div class="mTitle">${icon('folder-search',17)} اختر القسم</div>
            <button class="modalClose" onclick="closeCategoryPicker()">${icon('x',15)}</button>
          </div>
          <input type="text" id="catPickSearch" dir="auto" placeholder="ابحث عن قسم في كل التطبيق..." value="${escAttr(p.search)}" oninput="setCatPickerSearch(this.value)" style="width:100%;padding:11px 12px;border-radius:6px;border:1px solid var(--gold-dim);background:var(--panel-2);color:var(--parchment);font-size:14px;">
          ${items.length > CAP ? `<div style="font-size:11px;color:var(--text-dim);margin-top:8px;">${items.length} نتيجة — تُعرض أول ${CAP}، دقّق البحث أكثر.</div>` : ""}
          <div class="catPickList">
            ${shown.length ? shown.map(it => `
              <div class="catPickRow ${p.currentValue===it.id?'sel':''}" onclick="selectFromCategoryPicker('${it.id}')" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                <div>
                  <div class="nm" dir="auto">${esc(it.name)}</div>
                  <div class="pth">${esc(it.path)}</div>
                </div>
                <span style="font-size:11px;color:var(--text-dim);white-space:nowrap;">${it.qCount} سؤال${it.subCount?' · '+it.subCount+' فرعي':''}</span>
              </div>`).join("") : `<div class="emptyState" style="padding:24px 10px;">لا توجد نتائج مطابقة.</div>`}
          </div>
        </div>
      </div>`;
  }

  // ── وضع التصفّح الهرمي: قسم رئيسي → فرعي → ... (نفس منطق واجهة الطالب) ──
  const browsePath = p.browsePath || [];
  const parentId = browsePath.length ? browsePath[browsePath.length-1].id : null;
  const kids = childrenOf(parentId);
  const parentObj = parentId ? byId(parentId) : null;

  const crumbsHtml = `
    <div class="crumbs" style="margin-bottom:10px;">
      <button onclick="catPickerCrumbRoot()">${icon('home',13)} الجذر</button>
      ${browsePath.map((n,i)=>`<span class="sep">/</span><button onclick="catPickerCrumb(${i})" dir="auto">${esc(n.name)}</button>`).join("")}
    </div>`;

  const selectHereRow = (browsePath.length) ? `
    <div class="catPickRow sel" style="display:flex;align-items:center;justify-content:space-between;gap:8px;" onclick="selectFromCategoryPicker('${parentId}')">
      <div style="display:flex;align-items:center;gap:6px;">${icon('check-circle',15)}<span class="nm" dir="auto">اختر «${esc(parentObj?parentObj.name:'')}» نفسه</span></div>
      <span style="font-size:11px;color:var(--text-dim);">${directQuestionCount(parentId)} سؤال مباشر</span>
    </div>` : (p.allowNull ? `
    <div class="catPickRow ${!p.currentValue?'sel':''}" onclick="selectFromCategoryPicker('')"><div class="nm">${esc(p.nullLabel)}</div></div>` : "");

  const kidsHtml = kids.length ? kids.map(k => {
    const hasKids = childrenOf(k.id).length > 0;
    return `
    <div class="catPickRow" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <div style="flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;" onclick="${hasKids ? `catPickerEnter('${k.id}','${escJs(k.name)}')` : `selectFromCategoryPicker('${k.id}')`}">
        ${icon(hasKids?'folder':'file-text',15,'color:var(--gold-dim);')}
        <div>
          <div class="nm" dir="auto">${esc(k.name)}</div>
          <div class="pth">${directQuestionCount(k.id)} سؤال مباشر${nodeQuestionCount(k.id)!==directQuestionCount(k.id) ? ' · '+nodeQuestionCount(k.id)+' شامل الفروع' : ''}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:4px;">
        <button class="iconBtn" title="اختر هذا القسم مباشرة" onclick="event.stopPropagation(); selectFromCategoryPicker('${k.id}')">${icon('check',15)}</button>
        ${hasKids ? `<button class="iconBtn" title="فتح" onclick="event.stopPropagation(); catPickerEnter('${k.id}','${escJs(k.name)}')">${icon('chevron-left',16)}</button>` : ""}
      </div>
    </div>`;
  }).join("") : `<div class="emptyState" style="padding:20px 10px;">لا توجد أقسام فرعية هنا.</div>`;

  return `
    <div class="modalOverlay" onclick="if(event.target===this) closeCategoryPicker()">
      <div class="modalBox catPickModal">
        <div class="modalHead">
          <div class="mTitle">${icon('folder-search',17)} اختر القسم</div>
          <button class="modalClose" onclick="closeCategoryPicker()">${icon('x',15)}</button>
        </div>
        <input type="text" id="catPickSearch" dir="auto" placeholder="أو ابحث مباشرة بالاسم في كل التطبيق..." value="" oninput="setCatPickerSearch(this.value)" style="width:100%;padding:11px 12px;border-radius:6px;border:1px solid var(--gold-dim);background:var(--panel-2);color:var(--parchment);font-size:14px;margin-bottom:10px;">
        ${crumbsHtml}
        <div class="catPickList">
          ${selectHereRow}
          ${kidsHtml}
        </div>
      </div>
    </div>`;
}

async function loadExamPicker(categoryId){

async function saveQuestionEdit(){
  const qText = (questionEditor.question || "").trim();
  const expText = (questionEditor.explanation || "").trim();
  const newCategoryId = questionEditor.category_id;
  if(!qText){ state.notice = "نص السؤال لا يمكن أن يكون فارغًا."; render(); return; }
  /* خريطة الفهارس القديمة → الجديدة قبل حذف الخيارات الفارغة */
  const oldIndexToNewIndex = {};
  const options = [];
  questionEditor.options.forEach((o, i) => {
    const t = String(o).trim();
    if(t.length){ oldIndexToNewIndex[i] = options.length; options.push(t); }
  });
  if(options.length < 2){ state.notice = "لازم يبقى خيارين صالحين على الأقل."; render(); return; }
  if(!(questionEditor.correct in oldIndexToNewIndex)){
    state.notice = "الإجابة الصحيحة لا يمكن أن تكون خيارًا فارغًا";
    showToast("الإجابة الصحيحة لا يمكن أن تكون خيارًا فارغًا", 'err');
    render(); return;
  }
  const newCorrect = oldIndexToNewIndex[questionEditor.correct];

  const { error } = await sb.from("questions").update({
    question_text: qText,
    options: options,
    correct_index: newCorrect,
    explanation: expText || null,
    category_id: newCategoryId,

  if(error){ state.notice = error.message; showToast(error.message, 'err'); render(); return; }

function qStatus(q, i){
  const ua = (q.userAnswers || [])[i];
  if(ua === null || ua === undefined) return "none";
  return ua === q.questions[i].correct ? "correct" : "wrong";
}
function quizStats(q){
  let c=0, w=0;
  for(let i=0;i<q.questions.length;i++){ const st=qStatus(q,i); if(st==="correct") c++; else if(st==="wrong") w++; }
  return { correct:c, wrong:w, answered:c+w, left:q.questions.length-c-w };
}
function goToQuestion(i){
  const q = state.quiz;
  if(!q || i<0 || i>=q.questions.length) return;
  q.index = i;
  q.questionStartedAt = Date.now();
  const ua = (q.userAnswers || [])[i];
  q.answered = !(ua === null || ua === undefined);
  q.selected = q.answered ? ua : null;
  state.navOpen = false;
  saveProgress();
  render();
  try{ window.scrollTo({ top:0, behavior:'smooth' }); }catch(e){ /* noop */ }
}
function prevQuestion(){ if(state.quiz) goToQuestion(state.quiz.index-1); }
function toggleNav(open){
  state.navOpen = !!open;
  if(open) state.navFilter = state.navFilter || "all";
  render();
}
function setNavFilter(f){ state.navFilter = f; render(); }
function jumpToFirstUnanswered(){
  const q = state.quiz;
  if(!q) return;
  let t = -1;
  for(let k=1;k<=q.questions.length;k++){
    const i = (q.index + k) % q.questions.length;
    if(qStatus(q,i)==="none"){ t = i; break; }
  }
  if(t < 0){ showToast("لا توجد أسئلة غير محلولة", "ok"); return; }
  goToQuestion(t);
}
function finishQuiz(force){
  const q = state.quiz;
  if(!q) return;
  const st = quizStats(q);
  /* تأكيد فقط لو فيه أسئلة غير محلولة وتم حل 30% أو أكثر (إنهاء مبكر بدون تأكيد) */
  if(force !== true && st.left > 0 && (st.answered / q.questions.length) >= 0.3){
    askConfirm({ title:'إنهاء الاختبار', body:`لم تُجب عن ${st.left} سؤال. هل تريد إنهاء الاختبار وعرض النتيجة؟`, okLabel:'إنهاء وعرض النتيجة', danger:false }, () => doFinishQuiz());
    return;
  }
  doFinishQuiz();
}
function doFinishQuiz(){
  const q = state.quiz;
  if(!q) return;
  clearTimers();
  ensureQuizFields(q);
  q.finishedAt = Date.now();
  state.navOpen = false;
  updateWrongBank(q);
  recordSessionEnd();
  state.view = "results";
  state.resultsTab = "summary";
  state.resultsAnimated = false;
  clearProgress();
  twaHaptic('medium');
  render();
  try{ window.scrollTo({ top:0 }); }catch(e){ /* noop */ }
}
function resumeUnanswered(){
  const q = state.quiz;
  if(!q) return;
  let t = 0;
  for(let i=0;i<q.questions.length;i++){ if(qStatus(q,i)==="none"){ t = i; break; } }
  state.view = "quiz";
  goToQuestion(t);
}
function centerQuizChip(){
  const strip = document.querySelector('.qStrip');
  const el = strip && strip.querySelector('.qChip.cur');
  if(!strip || !el) return;
  const box = strip.getBoundingClientRect(), r = el.getBoundingClientRect();

function answerQuestion(optIndex){
  const q = state.quiz;
  if(!q || q.answered) return;
  ensureQuizFields(q);
  const now = Date.now();
  q.timePerQuestion[q.index] = Math.min(Math.max(0, now - q.questionStartedAt), 600000);
  q.questionStartedAt = now;
  q.answered = true;
  q.selected = optIndex;
  const question = q.questions[q.index];
  if(!q.userAnswers) q.userAnswers = new Array(q.questions.length).fill(null);
  q.userAnswers[q.index] = optIndex;
  const isCorrect = optIndex === question.correct;
  if(isCorrect){
    q.correct++;
    twaHaptic('light');
  } else {
    q.wrongList.push({ question, chosen: optIndex });
    twaHaptic('rigid');
  }
  recordAnswer(question.categoryId, question.setId, isCorrect);
  saveProgress();
  render();
}

function nextQuestion(){
  const q = state.quiz;
  if(q.index+1 < q.questions.length) goToQuestion(q.index+1);
  else finishQuiz();
}

async function addCategory(parentId, name){
  if(!name || !name.trim()) return;
  const cleanName = name.trim();
  const siblings = childrenOf(parentId);
  const dup = siblings.find(s => s.name.trim().toLowerCase() === cleanName.toLowerCase());
  if(dup){ showToast(`يوجد قسم بنفس الاسم "${cleanName}" بهذا المكان بالضبط. اختر اسمًا مختلفًا أو أضفه بمكان آخر.`, 'err', 4500); return; }
  const sort_order = siblings.length;
  const { error } = await sb.from("categories").insert({ parent_id: parentId, name: cleanName, sort_order });
  if(error){ state.notice = error.message; showToast(error.message, 'err'); render(); return; }
  showToast("تم إضافة القسم", "ok");
  if(parentId) treeExpanded.add(parentId);
  clearCache();
  await bumpServerUpdatedAt();
  await loadAll(true);
  state.view = "admin"; render();
}
async function renameCategory(id, name){
  if(!name || !name.trim()) return;
  const cleanName = name.trim();
  const cat = byId(id);
  const siblings = childrenOf(cat ? cat.parent_id : null);
  const dup = siblings.find(s => s.id !== id && s.name.trim().toLowerCase() === cleanName.toLowerCase());
  if(dup){ showToast(`يوجد قسم بنفس الاسم "${cleanName}" بهذا المكان بالضبط. اختر اسمًا مختلفًا.`, 'err', 4500); return; }
  const { error } = await sb.from("categories").update({ name: cleanName }).eq("id", id);
  if(error){ state.notice = error.message; showToast(error.message, 'err'); }
  else{ showToast("تم حفظ الاسم الجديد", "ok"); }
  clearCache();
  await bumpServerUpdatedAt();
  await loadAll(true);
  state.view = "admin"; render();
}

let categoryMoveLock = new Set();
async function moveCategory(id, dir){
  if(categoryMoveLock.has(id)) return; // يمنع تنفيذ نفس عملية التحريك مرتين إذا ضُغط الزر بسرعة قبل انتهاء الطلب السابق
  const cat = byId(id);
  if(!cat) return;
  const siblings = childrenOf(cat.parent_id);
  const idx = siblings.findIndex(s=>s.id===id);
  const targetIdx = idx + dir;
  if(targetIdx < 0 || targetIdx >= siblings.length) return;

  // تحديث فوري للترتيب محليًا (قبل انتظار الشبكة) — يمنع الاعتماد على بيانات قديمة عند الضغط المتكرر
  const reordered = siblings.slice();
  const [moved] = reordered.splice(idx, 1);
  reordered.splice(targetIdx, 0, moved);
  reordered.forEach((s, i) => { s.sort_order = i; });
  render();

  categoryMoveLock.add(id);
  try{
    // إعادة ترقيم كل الإخوة بأرقام متسلسلة فريدة (0،1،2...) بدل تبديل قسمين فقط،
    // هذا يمنع نهائيًا مشكلة تساوي/تعارض قيم sort_order مستقبلاً
    await Promise.all(reordered.map((s,i) => sb.from("categories").update({ sort_order: i }).eq("id", s.id)));
    clearCache();
    await bumpServerUpdatedAt();
  }catch(err){
    window.__debugLog('moveCategory error: ' + (err.message || JSON.stringify(err)));
    showToast('حدث خطأ أثناء حفظ الترتيب، حاول مرة أخرى.', 'err');
    await loadAll(true); // نعيد المزامنة مع الخادم لضمان عدم بقاء بيانات غير متطابقة محليًا
  }finally{
    categoryMoveLock.delete(id);
    state.view = "admin"; render();
  }
}

async function savePendingQuestions(categoryId){
  if(savingQuestions) return;
  if(!categoryId){ state.notice = "اختر القسم أولاً."; render(); return; }
  if(!pendingParsed.length){ state.notice = "لا توجد أسئلة مستخرجة للحفظ."; render(); return; }

  savingQuestions = true;
  render();
  try{
    let targetSetId = null;
    if(addTab.mode === "new"){
      const title = (addTab.newSetTitle || "").trim();
      if(!title){ state.notice = "اكتب اسمًا للاختبار الجديد."; return; }
      const { data: newSet, error: setErr } = await sb.from("question_sets")
        .insert({ category_id: categoryId, title, sort_order: setsForCategory(categoryId).length, shuffle_questions: addTab.newSetShuffle !== false })
        .select("id").single();
      if(setErr){ state.notice = setErr.message; return; }
      targetSetId = newSet.id;
    } else if(addTab.mode === "existing"){
      if(!addTab.existingSetId){ state.notice = "اختر الاختبار الذي تريد الإضافة إليه."; return; }
      targetSetId = (addTab.existingSetId !== "__legacy__") ? addTab.existingSetId : null;
    }

    const baseTs = Date.now();
    const rows = pendingParsed.map((q,i) => ({
      id: seqUuid(baseTs, i),
      category_id: categoryId,
      set_id: targetSetId,
      question_text: q.question,
      options: q.options,
      correct_index: q.correct,
      explanation: q.explanation || null,
    }));
    let { error } = await sb.from("questions").insert(rows);
    if(error && /\bid\b|bigint|integer|uuid/i.test(error.message||"")){
      ({ error } = await sb.from("questions").insert(rows.map(({id, ...rest}) => rest)));
    }
    if(error){ state.notice = error.message; return; }
    if(!targetSetId){
      const titleText = (addTab.quizTitle || "").trim();
      await sb.from("categories").update({ quiz_title: titleText || null }).eq("id", categoryId);
    }
    state.notice = `تم حفظ ${rows.length} سؤال بنجاح.`;
    showToast(`تم حفظ ${rows.length} سؤال بنجاح`, "ok");
    pendingParsed = [];
    addTab.mode = "new";
    addTab.newSetTitle = "";
    addTab.existingSetId = "";
    addTab.newSetShuffle = true;
    clearCache();
    {
      const catRef = byId(String(categoryId));
      await adminAppendAnnouncement({
        id: 'ann_' + Date.now(), type: 'new_questions', title: 'أسئلة جديدة في ' + (catRef ? catRef.name : 'القسم'),
        body: 'تمت إضافة ' + rows.length + ' سؤال جديد', createdAt: Date.now(), expiresAt: null,
        targetCategory: String(categoryId), actionLabel: 'فتح القسم', actionData: { type:'enterCategory', categoryId: String(categoryId) },
      });
    }
    await bumpServerUpdatedAt();
    await loadAll(true);
    state.view = "admin"; state.adminTab = "add";
    addTab.categoryId = categoryId;
  } finally {
    savingQuestions = false;
    render();
  }
}

/* escAttr: لقيمة داخل خاصية HTML (value="...") — escJs: لنص داخل علامات ' ' في onclick */
function escAttr(s){ return esc(s); }
function escJs(s){
  const js = String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r/g,'\\r').replace(/\n/g,'\\n')
    .replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029').replace(/</g,'\\x3c').replace(/>/g,'\\x3e');
  return js.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

function renderTreeNode(node, depth, visited){
  visited = visited || new Set();
  if(visited.has(node.id) || depth > 50){
    window.__debugLog('تم اكتشاف حلقة دائرية (Circular Reference) في الأقسام عند: ' + node.name + ' (id=' + node.id + ').');
    return `<div class="treeNode"><div class="treeRow">${icon('alert-triangle',14)}<span class="name" style="color:var(--danger);" dir="auto">${esc(node.name)} — خطأ: هذا القسم جزء من حلقة دائرية في الأقسام (parent_id غير صحيح)</span></div></div>`;
  }
  visited = new Set(visited);
  visited.add(node.id);
  const kids = childrenOf(node.id);
  const hasKids = kids.length > 0;
  const isOpen = treeExpanded.has(node.id);
  const toggleBtn = hasKids
    ? `<button class="iconBtn" title="${isOpen?'طي':'فتح'}" onclick="toggleTreeExpand('${node.id}')">${isOpen?icon('chevron-down',15):icon('chevron-left',15)}</button>`
    : `<span style="width:22px;display:inline-block;"></span>`;
  return `
    <div class="treeNode">
      <div class="treeRow">
        ${toggleBtn}
        <span class="name" dir="auto" ${hasKids?`style="cursor:pointer;" onclick="toggleTreeExpand('${node.id}')"`:""}>${esc(node.name)}</span>
        <span style="font-size:11px;color:var(--text-dim);">${(()=>{const d=directQuestionCount(node.id),t=nodeQuestionCount(node.id);return t>d? `${d} سؤال مباشر (${t} شاملاً الفروع)` : `${d} سؤال`;})()}</span>
        <button class="iconBtn" title="الوصف" onclick="openDescEditorForCategory('${node.id}')">${icon('file-text',14)}</button>
        <button class="iconBtn" title="إضافة قسم فرعي" onclick="promptAddCategory('${node.id}')">${icon('plus',14)}</button>
        <button class="iconBtn" title="إعادة تسمية" onclick="promptRenameCategory('${node.id}','${escJs(node.name)}')">${icon('pencil',14)}</button>
        <button class="iconBtn" title="تحريك لأعلى" onclick="moveCategory('${node.id}',-1)">${icon('chevron-up',14)}</button>
        <button class="iconBtn" title="تحريك لأسفل" onclick="moveCategory('${node.id}',1)">${icon('chevron-down',14)}</button>
        <button class="iconBtn danger" title="حذف" onclick="deleteCategory('${node.id}')">${icon('trash-2',14)}</button>
      </div>
      ${hasKids && isOpen ? `<div class="treeChildren">${kids.map(k=>renderTreeNode(k, depth+1, visited)).join("")}</div>` : ""}
    </div>`;
}

function toggleTreeExpand(id){
  if(treeExpanded.has(id)) treeExpanded.delete(id);
  else treeExpanded.add(id);
  render();
}
function toggleExamTreeExpand(id){
  if(examTreeExpanded.has(id)) examTreeExpanded.delete(id);
  else examTreeExpanded.add(id);
  render();
}

      </div>`;}).join("")}
    ` : `<div class="emptyState">لا توجد نتائج مطابقة.</div>`;
  } else {
    body = roots.length ? roots.map(r=>renderTreeNode(r,0)).join("") : `<div class="emptyState">لا توجد أقسام بعد. أضف أول قسم رئيسي أعلاه.</div>`;
  }

  return `
    <div class="field" style="display:flex;gap:8px;">
      <input type="text" id="newRootName" dir="auto" placeholder="اسم قسم رئيسي جديد (مثال: Pre-clinic)">

    </div>
    ${body}
  `;
}

function catOptionsHtml(selectedId){
  function walk(parentId, depth, visited){
    visited = visited || new Set();
    let out = [];
    for(const c of childrenOf(parentId)){
      if(visited.has(c.id) || depth > 50){
        window.__debugLog('تم اكتشاف حلقة دائرية (Circular Reference) في الأقسام عند: ' + c.name + ' (id=' + c.id + ').');
        continue;
      }
      out.push(`<option value="${c.id}" ${c.id===selectedId?"selected":""}>${"— ".repeat(depth)}${esc(c.name)}</option>`);
      const nextVisited = new Set(visited);
      nextVisited.add(c.id);
      out = out.concat(walk(c.id, depth+1, nextVisited));
    }
    return out;
  }
  return walk(null,0).join("");
}

function renderExamCheckTree(node, depth, visited){
  visited = visited || new Set();
  if(visited.has(node.id) || depth > 50) return "";
  visited = new Set(visited);
  visited.add(node.id);
  const kids = childrenOf(node.id);
  const hasKids = kids.length > 0;
  const isOpen = examTreeExpanded.has(node.id);
  const checked = examBuilder.selected.has(node.id);
  const toggleBtn = hasKids
    ? `<button class="iconBtn" title="${isOpen?'طي':'فتح'}" onclick="toggleExamTreeExpand('${node.id}')">${isOpen?icon('chevron-down',15):icon('chevron-left',15)}</button>`
    : `<span style="width:22px;display:inline-block;"></span>`;
  return `
    <div class="treeNode">
      <div class="treeRow">
        ${toggleBtn}
        <input type="checkbox" ${checked?"checked":""} onchange="toggleExamBuilderCategory('${node.id}')" style="width:18px;height:18px;">
        <span class="name" dir="auto" ${hasKids?`style="cursor:pointer;" onclick="toggleExamTreeExpand('${node.id}')"`:""}>${esc(node.name)}</span>
        <span style="font-size:11px;color:var(--text-dim);">${directQuestionCount(node.id)} سؤال</span>
      </div>
      ${hasKids && isOpen ? `<div class="treeChildren">${kids.map(k=>renderExamCheckTree(k, depth+1, visited)).join("")}</div>` : ""}
    </div>`;
}

let lastRenderedView = null;
function render(){
  clearTimers();  /* Bug #5: لا تسريب للمؤقّتات */
  const app = document.getElementById("app");
  const sameView = lastRenderedView === state.view;
  const scrollY = sameView ? (window.pageYOffset || document.documentElement.scrollTop || 0) : null;

  // احفظ التركيز الحالي قبل إعادة الرسم (عشان الكيبورد ما يقفلش في الموبايل)
  const active = document.activeElement;
  let focusKey = null, selStart = null, selEnd = null;
  if(active && app.contains(active) && active.getAttribute && active.getAttribute('data-fkey')){
    focusKey = active.getAttribute('data-fkey');
    if(typeof active.selectionStart === 'number'){
      selStart = active.selectionStart;
      selEnd = active.selectionEnd;
    }
  }

  let html = "";
  switch(state.view){
    case "loading": html = `${renderTopbar()}<div class="skel"></div><div class="skel"></div><div class="skel"></div>`; break;
    case "connectionError": html = renderConnectionError(); break;
    case "home": html = renderHome(); break;
    case "quiz": html = renderQuiz(); break;
    case "results": html = renderResults(); break;
    case "review": html = renderReview(); break;
    case "study": html = renderStudy(); break;
    case "stats": html = renderStats(); break;
    case "bookmarks": html = renderBookmarks(); break;
    case "wrongBank": html = renderWrongBank(); break;
    case "adminLogin": html = renderAdminLogin(); break;
    case "admin": html = renderAdmin(); break;
  }
  app.innerHTML = html;
  if(!sameView){ app.classList.remove('fadeIn'); void app.offsetWidth; app.classList.add('fadeIn'); }
  renderModalRoot();
  refreshIcons();
  updateTwaBackButton();
  if(state.view === 'quiz'){ centerQuizChip(); startTimerTick(); }
  if(state.view === 'results' && !state.resultsAnimated){
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const c = document.getElementById('ringFg');
      if(c){ c.style.strokeDashoffset = c.getAttribute('data-target'); }
      state.resultsAnimated = true;
    }));
  }

  // رجّع التركيز لنفس الحقل بعد إعادة الرسم
  if(focusKey){
    const el = app.querySelector(`[data-fkey="${focusKey}"]`);
    if(el){
      el.focus();
      if(selStart !== null && typeof el.setSelectionRange === 'function'){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){ /* noop */ }
      }
    }
  }
  if(scrollY !== null){ try{ window.scrollTo(0, scrollY); }catch(e){ /* noop */ } }
  lastRenderedView = state.view;
  maybeShowAnnouncements();
}

function pad(n){ return (n < 10 ? '0' : '') + n; }
function lsGet(key, def){
  try{ const r = localStorage.getItem(key); return r ? JSON.parse(r) : def; }catch(e){ return def; }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; }
}
function safeKey(k){ return typeof k === 'string' && /^[\w\-.:]{1,80}$/.test(k) && k !== '__proto__' && k !== 'constructor' && k !== 'prototype'; }
function num(v, def){ v = Number(v); return isFinite(v) ? v : (def || 0); }
function byteLen(str){ try{ return new TextEncoder().encode(str).length; }catch(e){ return String(str).length * 3; } }
function dayKey(ts){
  const d = new Date(ts || Date.now());
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function daysBetween(a, b){
  const pa = String(a).split('-').map(Number), pb = String(b).split('-').map(Number);
  const da = new Date(pa[0], pa[1]-1, pa[2]), db = new Date(pb[0], pb[1]-1, pb[2]);
  return Math.round((db - da) / 86400000);
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  return pad(Math.floor(sec/60)) + ':' + pad(sec % 60);
}
function fmtDur(ms){ return fmtTime(ms / 1000); }

/* ═══════════════════════════════════════════════════════════
   FEATURE: THEME (dark / light / auto)
   ═══════════════════════════════════════════════════════════ */
const THEME_KEY = 'qbank_theme';
const THEME_AT_KEY = 'qbank_theme_at';
function getThemePref(){
  try{ const v = localStorage.getItem(THEME_KEY); return (v === 'dark' || v === 'light' || v === 'auto') ? v : 'auto'; }catch(e){ return 'auto'; }
}
function resolveTheme(pref){
  if(pref === 'dark' || pref === 'light') return pref;
  try{ return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'; }catch(e){ return 'dark'; }
}
function currentTheme(){ return document.documentElement.getAttribute('data-theme') || 'dark'; }
function applyTheme(){
  const t = resolveTheme(getThemePref());
  document.documentElement.setAttribute('data-theme', t);
  const bg = t === 'light' ? '#f7f2e7' : '#0b0908';
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', bg);
  try{
    if(TWA){
      if(TWA.setHeaderColor) TWA.setHeaderColor(bg);
      if(TWA.setBackgroundColor) TWA.setBackgroundColor(bg);
    }
  }catch(e){ /* noop */ }
  updateThemeBtn();
}
function updateThemeBtn(){
  const b = document.getElementById('themeBtn');
  if(!b) return;
  b.innerHTML = icon(currentTheme() === 'dark' ? 'sun' : 'moon', 17);
  refreshIcons();
}
function toggleTheme(){
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_KEY, next); localStorage.setItem(THEME_AT_KEY, String(Date.now())); }catch(e){ /* noop */ }
  const root = document.documentElement;
  root.classList.add('themeSwitch');
  applyTheme();
  setTimeout(() => root.classList.remove('themeSwitch'), 450);
  twaHaptic('light');
  scheduleCloudSync('theme');
}
window.toggleTheme = toggleTheme;
try{
  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    const onChange = () => { if(getThemePref() === 'auto') applyTheme(); };
    if(mq.addEventListener) mq.addEventListener('change', onChange); else if(mq.addListener) mq.addListener(onChange);
  }
}catch(e){ /* noop */ }
